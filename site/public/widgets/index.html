<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cortxt</title>
<style>
:root{color-scheme:dark;--layer:#ffffff0d;--hover:#ffffff15;--stroke:#5b6471;--strong:#727c8a;--text:#e7ebf0;--muted:#8d97a3;--dim:#65717f;--accent:#8fa3c7;--blue:#7885a7;--ok:#a8d5ba;--warn:#d8c49a;--bad:#d9a6b2;--sans:Inter,"Segoe UI Variable","Segoe UI",sans-serif;--mono:"Cascadia Code","Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,var(--background,#101216),color-mix(in srgb,var(--surface,#181b20) 72%,var(--background,#101216)));font-family:var(--sans);color:var(--text);padding:16px}
button,select{font:inherit}
.window{position:fixed;width:1200px;max-width:calc(100vw - 32px);height:calc(100vh - 32px);max-height:900px;border:1px solid var(--stroke);border-radius:16px;overflow:hidden;background:var(--surface,#181b20);box-shadow:0 28px 72px #0008,0 1px #ffffff0a inset;display:flex;flex-direction:column;box-sizing:border-box}
.window.maximized{width:calc(100vw - 32px) !important;height:calc(100vh - 32px) !important;max-height:none !important;left:16px !important;top:16px !important}
.window.minimized{height:34px !important;transition:height .15s ease}
.window.minimized .content,.window.minimized .window-resize{display:none}
.global-bar{cursor:grab}
.global-bar.dragging{cursor:grabbing}
.win-controls{display:flex;gap:5px;flex:none}
.win-btn{width:20px;height:20px;border:1px solid var(--strong);border-radius:5px;background:var(--layer);color:var(--muted);font-size:11px;line-height:1;cursor:pointer;display:grid;place-items:center}
.win-btn:hover{color:var(--text);background:var(--hover)}
.win-btn.close-btn:hover{color:var(--bad);border-color:var(--bad)}
.reopen-fab{position:fixed;left:16px;bottom:16px;width:44px;height:44px;border-radius:50%;border:1px solid var(--strong);background:linear-gradient(135deg,var(--accent),var(--blue));color:#06263b;font-weight:700;cursor:pointer;box-shadow:0 12px 32px #000a;z-index:50}
.reopen-fab.hidden{display:none}
.window-resize{display:block;position:absolute;right:2px;bottom:2px;width:16px;height:16px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--strong) 50%);border-bottom-right-radius:14px;z-index:5}
.window.maximized .window-resize{display:none}
.global-bar{height:34px;display:flex;align-items:center;gap:10px;justify-content:flex-start;border-bottom:1px solid var(--stroke);background:#ffffff05;flex:none;padding:0 12px}
.identity{display:flex;align-items:center;gap:8px}
.icon{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--blue));color:#06263b;font-size:10px;font-weight:700}
.appname{font-size:12px;color:var(--muted)}
.global-bar .gbar-context{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--layer);border:1px solid var(--stroke);border-radius:4px;padding:2px 8px;}
.global-bar .gbar-spacer{flex:1;}
.global-bar .gbar-search{font-family:var(--mono);font-size:10.5px;color:var(--dim);border:1px solid var(--stroke);border-radius:4px;padding:2px 8px;cursor:pointer;}
.app-rail{width:148px;flex:0 0 auto;display:flex;flex-direction:column;gap:2px;padding:10px 8px;background:var(--surface,#ffffff05);border-right:1px solid var(--stroke);}
.app-rail .rail-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;background:transparent;color:var(--muted);font-size:12.5px;cursor:pointer;border:1px solid transparent;width:100%;text-align:left;}
.app-rail .rail-item svg{width:17px;height:17px;flex:0 0 auto;}
.app-rail .rail-item.active{background:var(--layer);color:var(--text);}
.app-rail .rail-item.active svg{color:var(--accent);}
.app-rail .rail-item:hover:not(.active){background:var(--layer);}
.app-rail .rail-item:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.work-console-home{padding:16px;display:flex;flex-direction:column;gap:16px;}
.work-console-home.hidden{display:none;}
.wch-section h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);}
.wch-section:has(.empty):not(#wch-active){display:none;}
.wch-body .empty{color:var(--dim);font-size:12px;padding:8px 0;}
#execution-authority{margin:12px;}
#execution-authority.hidden{display:none;}
#wch-active-body,#wch-waiting-body{cursor:pointer;}
.workstream-detail{padding:16px;display:flex;flex-direction:column;gap:16px;overflow:auto;}
.workstream-detail.hidden{display:none;}
.ws-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.eyebrow-os{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);}
.h-lg{font-size:18px;font-weight:600;margin:2px 0;}
.btn-row{display:flex;gap:8px;align-items:center;}
.ws-actions{flex:none;}
.btn{border:1px solid var(--strong);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;background:var(--layer);color:var(--text);}
.btn:hover{background:var(--hover);}
.btn-secondary{background:transparent;color:var(--muted);}
.btn-primary{background:var(--accent);color:#06263b;font-weight:600;border-color:var(--accent);}
.icon-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--strong);background:var(--layer);color:var(--muted);cursor:pointer;display:grid;place-items:center;}
.icon-btn:hover{color:var(--text);background:var(--hover);}
#focus-btn::before{content:"\2922";}
#tb-back::before{content:"\2190";}
#tb-overflow::before{content:"\22ee";}
.section{width:100%;}
.card{border:1px solid var(--stroke);border-radius:10px;background:#ffffff05;padding:12px;}
.two-col-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.data-tbl{width:100%;border-collapse:collapse;font-size:12px;}
.data-tbl th,.data-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--stroke);}
.data-tbl th{color:var(--dim);font-weight:500;text-transform:uppercase;font-size:10.5px;}
.check-item{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid var(--stroke);}
.check-item .lbl{color:var(--muted);}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:12px;}
.kv dt{color:var(--dim);}
.kv dd{margin:0;}
body.focus-mode #app-rail,body.focus-mode .global-bar,body.focus-mode .top-bar-narrow,body.focus-mode .bottom-nav{opacity:0;pointer-events:none;transition:opacity 120ms;}
.focus-mode-exit{position:fixed;top:8px;right:8px;z-index:50;}
.focus-overlay{position:fixed;inset:0;z-index:40;background:var(--background,#080b14);padding:32px;overflow:auto;}
.focus-overlay.hidden{display:none;}
.focus-overlay .h-lg{font-size:20px;}
.global-bar .gbar-mode-toggle{font-family:var(--mono);font-size:10px;background:var(--layer);border:1px solid var(--stroke);border-radius:4px;padding:2px 8px;color:var(--muted);cursor:pointer;}
.global-bar .gbar-mode-toggle.active{background:var(--accent);color:var(--background);border-color:var(--accent);}
body:not(.arrange-mode) #canvas-toolbar{display:none;}
body:not(.arrange-mode) .dock-tabbar{pointer-events:none;}
body:not(.arrange-mode) .dock-tab-close{display:none;}
.top-bar-narrow{display:none;}
.overflow-menu{display:none;}
.bottom-nav{display:none;}
@media (max-width: 736px){
  .global-bar{display:none;}
  .app-rail{display:none;}
  .top-bar-narrow.hidden{display:none;}
  .top-bar-narrow{display:flex;align-items:center;gap:8px;height:44px;padding:0 10px;background:var(--surface,#101522);border-bottom:1px solid var(--stroke);position:relative;}
  .top-bar-narrow .tb-ctx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11px;color:var(--muted);}
  .top-bar-narrow .hidden{display:none;}
  .overflow-menu.hidden{display:none;}
  .overflow-menu{display:block;position:absolute;top:44px;right:8px;z-index:30;background:var(--surface,#101522);border:1px solid var(--stroke);border-radius:6px;overflow:hidden;min-width:170px;}
  .ov-item{display:block;width:100%;text-align:left;padding:10px 12px;font-size:12.5px;background:none;border:none;border-bottom:1px solid var(--stroke);cursor:pointer;color:var(--text);}
  .ov-item:last-child{border-bottom:none;}
  .content{padding-bottom:56px;}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:56px;background:var(--surface,#101522);border-top:1px solid var(--stroke);z-index:40;}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--muted);font-size:9.5px;}
  .bn-item svg{width:18px;height:18px;}
  .bn-item.active{color:var(--accent);}
  .work-console-home{padding:10px;}
  .breadcrumb{display:none;}
  .ws-head{flex-direction:column;align-items:flex-start;}
  .ws-actions{width:100%;flex-direction:column;align-items:stretch;}
  .ws-actions .btn-secondary{background:none;border:none;justify-content:flex-start;padding:8px 2px;}
  .two-col-grid{grid-template-columns:1fr;}
  .kv{grid-template-columns:1fr;}
}
.toolbar{display:flex;align-items:center;gap:8px}
.toggle-btn{border:0;background:transparent;color:var(--muted);font-size:11px;padding:2px 9px;cursor:pointer;transition:all .15s}
.toggle-btn:hover{color:var(--text);background:var(--hover)}
.toggle-btn.active{background:var(--accent);color:#061325;font-weight:600}
.content{flex:1;min-height:0;padding:12px;overflow:hidden;display:flex;flex-direction:row;gap:0}
.maker-pane{flex:none;width:340px;min-width:260px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:10px;transition:width .2s ease,min-width .2s ease,padding .2s ease}
.maker-pane.app-hidden,.content-divider.app-hidden{display:none}
.maker-pane.collapsed{width:0 !important;min-width:0;padding:0;border:0;overflow:hidden}
.content-divider{flex:none;width:6px;margin:0 4px;cursor:col-resize;position:relative;border-radius:3px;background:var(--stroke);transition:background .1s ease}
.content-divider::after{content:"";position:absolute;top:0;bottom:0;left:-4px;right:-4px}
.content-divider:hover,.content-divider.dragging{background:var(--accent)}
.content-divider.collapsed{cursor:default}
.maker-collapse-toggle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:18px;height:26px;border:1px solid var(--strong);border-radius:5px;background:#181b20ea;color:var(--muted);font-size:10px;line-height:1;cursor:pointer;display:grid;place-items:center;z-index:6}
.maker-collapse-toggle:hover{color:var(--text);background:var(--hover);border-color:var(--accent)}
.tab{display:flex;flex-direction:column;gap:8px}
.hidden{display:none !important}
.wcard{border:1px solid var(--strong);border-radius:10px;background:#0c101c80;display:flex;flex-direction:column;overflow:hidden;max-height:400px;box-shadow:0 8px 24px #0006}
.wcard .head{padding:10px 12px;border-bottom:1px solid var(--stroke);background:#ffffff04}
.wcard-body{flex:1;min-height:0;padding:10px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.title{font-size:13px;line-height:1.35;margin-top:3px;max-width:330px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:600;background:#8fa3c722;color:var(--accent);flex:none}
.badge:before{content:"●"}
.badge.ok{background:#a8d5ba20;color:var(--ok)}
.badge.err{background:#d9a6b220;color:var(--bad)}
.badge.off{background:#ffffff12;color:var(--dim)}
.empty{margin:auto;padding:18px;text-align:center;color:var(--dim);font-size:11.5px;border:1px dashed var(--stroke);border-radius:7px;width:100%}
.pulse-status{margin:0;padding:7px 9px;border:1px solid var(--stroke);border-radius:6px;color:var(--muted);font-size:10.5px}
.pulse-status.error{color:var(--bad)}
.candidate-group{margin:6px 0}
.candidate-group h3{margin:0 0 5px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.candidate-table{width:100%;border-collapse:collapse;font-size:10px}
.candidate-table th,.candidate-table td{padding:5px 6px;border-bottom:1px solid var(--stroke);text-align:left;vertical-align:top}
.candidate-table th{color:var(--dim);font-weight:500}
.candidate-table td:nth-child(2){max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.candidate-chain{margin:0;padding:6px 9px;border:1px solid var(--stroke);border-radius:6px;background:var(--layer);font-size:10px;color:var(--muted)}
.candidate-chain b{color:var(--text);font-weight:600}
.candidate-action{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.candidate-copy{border:1px solid var(--strong);border-radius:5px;background:var(--layer);color:var(--accent);font-size:10px;padding:3px 7px;cursor:pointer}
.candidate-copy:hover{background:var(--hover)}
.candidate-copy.copied{color:var(--ok)}
.candidate-cmd{font:9.5px var(--mono);color:var(--dim);border:1px solid var(--stroke);border-radius:4px;background:#0d1220;padding:2px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pulse-stat{padding:6px 7px;border:1px solid var(--stroke);border-radius:6px;background:var(--layer);min-width:0}
.pulse-stat b{display:block;font:600 13px var(--mono);color:var(--text)}
.pulse-stat span{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-bottom:1px solid var(--stroke)}
.row-main{flex:1;min-width:0}
.row-title{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.action-form{margin:2px 0 4px;padding:5px 6px;border:1px solid var(--stroke);border-radius:5px;background:var(--layer);display:flex;flex-direction:column;gap:4px;min-width:200px}
.action-form label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.action-ref{width:100%;font:10px var(--mono);background:#0d1220;border:1px solid var(--strong);border-radius:4px;color:var(--text);padding:3px 5px}
.action-confirm-row{display:flex;gap:5px;align-items:center;font-size:9.5px;color:var(--muted)}
.action-run{border:1px solid var(--accent);border-radius:5px;background:#0d1220;color:var(--accent);font-size:10px;padding:3px 8px;cursor:pointer}
.action-run:disabled{opacity:.4;cursor:not-allowed}
.action-run.running{color:var(--warn)}
.action-result{margin-top:3px;font-size:9.5px;color:var(--muted);word-break:break-word}
.action-result.ok{color:var(--ok)}
.action-result.denied{color:var(--bad)}
.action-result.error{color:var(--warn)}
.chart-bars-container{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.chart-bar-row{display:flex;align-items:center;gap:8px;font-size:10px}
.chart-bar-label{width:90px;flex:none;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-bar-track{flex:1;height:8px;background:var(--layer);border:1px solid var(--stroke);border-radius:4px;overflow:hidden;position:relative}
.chart-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s ease}
.chart-bar-value{width:60px;flex:none;text-align:right;font-family:var(--mono);color:var(--text);font-size:9.5px}
.chart-line-svg{width:100%;height:70px;overflow:visible}
.chart-line-points-row{display:flex;justify-content:space-between;font-size:9px;color:var(--dim);margin-top:2px}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);filter:drop-shadow(0 0 8px rgba(77,107,254,0.85))}50%{opacity:.65;transform:scale(1.05);filter:drop-shadow(0 0 2px rgba(77,107,254,0.3))}}
.pulse-dot{animation:pulse 1.5s ease-in-out infinite;transform-origin:center}
.chart-latest{animation:pulse 1.5s ease-in-out infinite}
.swimlane-container{display:flex;flex-direction:column;gap:6px;margin:4px 0;width:100%}
.swimlane-header{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);font-weight:600;margin:0 0 4px}
.swimlane-columns{display:grid;grid-template-columns:90px 1fr;font-size:9.5px;color:var(--dim);font-weight:500;padding:2px 4px;border-bottom:1px solid var(--stroke)}
.swimlane-table{display:flex;flex-direction:column;gap:5px;width:100%}
.swimlane-lane{display:grid;grid-template-columns:90px 1fr;align-items:center;min-height:28px;padding:3px 5px;background:rgba(255,255,255,0.02);border:1px solid var(--stroke);border-radius:5px;gap:6px}
.swimlane-label{font-size:10.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swimlane-track{display:flex;align-items:center;gap:6px;position:relative;flex-wrap:wrap;min-height:20px}
.swimlane-track-line{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--stroke);z-index:0}
.swimlane .marker,.swimlane-marker{position:relative;z-index:1;display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:4px;font-size:9.5px;font-family:var(--mono);background:#171d2e;border:1px solid var(--stroke);color:var(--muted)}
.swimlane .marker.done,.swimlane-marker.done{border-color:rgba(104,211,145,0.4);color:var(--ok);background:rgba(104,211,145,0.08)}
.swimlane .marker.running,.swimlane .marker.active,.swimlane-marker.active,.swimlane-marker.running{background:linear-gradient(90deg,#7885a7,var(--accent));border-color:var(--accent);color:#fff;font-weight:600;box-shadow:0 0 9px #8fa3c788;animation:pulse 2s infinite ease-in-out}
.swimlane .marker.blocked,.swimlane-marker.blocked{border-color:rgba(255,122,144,0.4);color:var(--bad);background:rgba(255,122,144,0.08)}
.swimlane .marker.queued,.swimlane-marker.queued{opacity:0.6}
/* Warroom cockpit treatment */
@keyframes token-pulse{0%,100%{box-shadow:0 0 4px var(--glow-accent,rgba(77,107,254,0.55)),0 0 0 1px var(--glow-accent,rgba(77,107,254,0.55));opacity:1}50%{box-shadow:0 0 16px var(--glow-accent,rgba(77,107,254,0.55));transform:scale(1.04);opacity:.82}}
.glow-live{animation:token-pulse var(--duration-live,1600ms) var(--easing-pulse,ease-in-out) infinite}
.glow-live.ok{--glow-accent:var(--glow-ok,rgba(104,211,145,0.55))}
.glow-live.warn{--glow-accent:var(--glow-warn,rgba(246,200,95,0.5))}
.glow-live.bad{--glow-accent:var(--glow-bad,rgba(255,122,144,0.5))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--grid-line,rgba(255,255,255,0.02)) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line,rgba(255,255,255,0.02)) 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 70%)}
body>*{position:relative;z-index:1}
.window{box-shadow:var(--shadow-instrument,0 24px 64px rgba(0,0,0,0.6)),inset 0 1px 0 rgba(255,255,255,0.06);background:linear-gradient(180deg,rgba(255,255,255,0.05) 0%,transparent 10%),#181b20e6}
.wcard{border:var(--bezel-width,1px) solid var(--strong);background:linear-gradient(180deg,var(--sheen-top,rgba(255,255,255,0.07)) 0%,transparent 8%),radial-gradient(120% 140% at 15% -10%,#1a2340 0%,#181b20c0 55%);box-shadow:var(--shadow-panel,0 12px 32px rgba(0,0,0,0.45));transition:box-shadow var(--duration-medium,200ms) var(--easing,ease),transform var(--duration-medium,200ms) var(--easing,ease)}
.wcard:hover{box-shadow:var(--shadow-instrument,0 24px 64px rgba(0,0,0,0.6))}
.tabs button.active:after{background:var(--accent);box-shadow:0 0 6px var(--glow-accent,var(--accent))}
.widget-panel{border:1px solid var(--strong);border-radius:10px;background:linear-gradient(180deg,var(--sheen-top,rgba(255,255,255,0.07)) 0%,transparent 8%),var(--layer)}
.canvas-view{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;position:relative}
.canvas-toolbar{display:flex;gap:8px;flex:none;position:relative}
.canvas-tool-btn{border:1px solid var(--strong);border-radius:5px;background:var(--layer);color:var(--muted);font-size:11px;padding:4px 9px;cursor:pointer}
.canvas-tool-btn:hover{color:var(--text);background:var(--hover)}
.canvas-picker{position:absolute;top:30px;left:0;z-index:5;background:#181b20f0;border:1px solid var(--strong);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto;min-width:180px;box-shadow:0 12px 32px #000a}
.canvas-picker-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer}

  const children=(tree&&tree.render&&tree.render.children)||[];
  const byLabel=label=>children.find(c=>c.props&&c.props.label===label);
  const heading=children.find(c=>c.primitive==="heading");
  const outcome=byLabel("Outcome");
  const gatesTable=byLabel("Gates");
  const kvNodes=children.filter(c=>c.primitive==="key-value");

  const continuityNode=kvNodes.find(c=>c.props&&c.props.value&&c.props.value.authority!==undefined);

    title:(heading&&heading.props&&heading.props.value)||"",
    outcome:(outcome&&outcome.props&&outcome.props.value)||"",
    gates:(gatesTable&&gatesTable.props&&gatesTable.props.rows)||[],
    mandate:(mandateNode&&mandateNode.props&&mandateNode.props.value)||{},

function renderCanvasToolbar(toolbar){if(!toolbar)return;toolbar.replaceChildren();const addBtn=document.createElement("button");addBtn.type="button";addBtn.className="canvas-tool-btn";addBtn.textContent="+ Widgets";const panel=document.createElement("div");panel.className="canvas-picker hidden";manifest.forEach(w=>{const row=document.createElement("label");row.className="canvas-picker-row";const box=document.createElement("input");box.type="checkbox";box.checked=dockTree.isVisible(w.id);box.onchange=()=>{if(box.checked)dockTree.showWidget(w.id);else dockTree.hideWidget(w.id)};const label=document.createElement("span");label.textContent=w.title||w.id;row.append(box,label);panel.append(row)});let open=false;addBtn.onclick=()=>{open=!open;panel.classList.toggle("hidden",!open)};const resetBtn=document.createElement("button");resetBtn.type="button";resetBtn.className="canvas-tool-btn";resetBtn.textContent="Reset layout";resetBtn.onclick=()=>{dockTree.reset();renderCanvasToolbar(toolbar)};toolbar.append(addBtn,resetBtn,panel)}
const WINDOW_SIZE_KEY="cortxt-window-size";

const MAKER_PANE_WIDTH_KEY="cortxt-maker-pane-width",MAKER_PANE_MIN=260,DOCK_MIN=300,MAKER_PANE_COLLAPSED_KEY="cortxt-maker-pane-collapsed";

async function loadManifest(){try{const r=await fetch("widgets.json",{cache:"no-store"});if(!r.ok)throw Error(r.status);const m=await r.json();manifest=(m.widgets||[]).filter(w=>w.id&&w.artifact);if(!manifest.length)throw Error("empty manifest");renderCanvasView();pollAll(true)}catch(e){empty($("dock-root"),"No widgets manifest. Run `cortxt widget` to serve widgets (widgets.json).")}}
var appState = {apps: [], activeId: "studio"};
let currentWorkstreamId = null;
const RAIL_ICONS = {
  work: '<path d="M4 7h16M4 12h16M4 17h10"/>',
  decisions: '<path d="M5 12l4 4 10-10"/>',
  evidence: '<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 16h6"/>',
  execution: '<path d="M3 12h4l2-7 4 14 2-7h6"/>',
  studio: '<path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/>'
};
function railIconSvg(key){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${RAIL_ICONS[key]||""}</svg>`;

function applyApp(appId){
  var app = appState.apps.find(function(a){return a.id === appId});
  if(!app) return;
  appState.activeId = appId;
  var studioOpen = appId === "studio";
  document.body.classList.toggle("studio-active", studioOpen);
  $("maker-pane")?.classList.toggle("app-hidden", !studioOpen);
  $("maker-divider")?.classList.toggle("app-hidden", !studioOpen);
  if(studioOpen) setMakerPaneCollapsed(false);
  var allIds = manifest.map(function(w){return w.id});
  allIds.forEach(function(id){
    if(!dockTree) return;
    var shouldShow = app.widgets === null || app.widgets.indexOf(id) !== -1;
    var isVisible = dockTree.isVisible(id);
    if(shouldShow && !isVisible) dockTree.showWidget(id);
    else if(!shouldShow && isVisible) dockTree.hideWidget(id);
  });
  document.querySelectorAll("[data-app-tab]").forEach(function(btn){
    btn.classList.toggle("active", btn.getAttribute("data-app-tab") === appId);
  });
  renderCanvasView();
  updateNarrowTopBar();
  renderBottomNav();
}
function renderAppRail(){
  var rail = $("app-rail");
  if(!rail) return;
  rail.replaceChildren();
  appState.apps.filter(function(a){return a.id !== "all"}).forEach(function(app){
    var item = document.createElement("button");
    item.type = "button";
    item.setAttribute("data-app-tab", app.id);
    item.className = "rail-item" + (app.id === appState.activeId ? " active" : "");
    item.innerHTML = railIconSvg(app.icon);
    var label = document.createElement("span");
    label.textContent = app.title;
    item.append(label);
    item.setAttribute("aria-label", app.title);
    item.onclick = function(){
      if(app.id === appState.activeId && currentWorkstreamId){ currentWorkstreamId = null; renderCanvasView(); renderAppRail(); updateNarrowTopBar(); renderBottomNav(); return; }
      applyApp(app.id);
      renderAppRail();
    };
    rail.append(item);
  });
}
async function loadApps(){
  try{
    var r = await fetch("apps.json", {cache: "no-store"});
    if(!r.ok) throw Error(r.status);
    var data = await r.json();
    appState.apps = data.apps || [];
    renderAppRail();
    applyApp(appState.activeId);
    updateNarrowTopBar();
    renderBottomNav();
  } catch(e) { /* apps.json is optional; dock behaves unfiltered without it */ }
}

function initWindowControls(){const win=$("window"),fab=$("reopen-fab");let maxRect=null;let saved=null;try{saved=JSON.parse(localStorage.getItem(WINDOW_STATE_KEY))}catch(e){}if(saved){win.classList.toggle("minimized",!!saved.minimized);win.classList.toggle("maximized",!!saved.maximized);if(saved.closed){win.classList.add("hidden");fab.classList.remove("hidden")}}$("win-minimize").onclick=()=>{win.classList.toggle("minimized");saveWindowState({minimized:win.classList.contains("minimized"),maximized:win.classList.contains("maximized")})};$("global-bar").addEventListener("dblclick",ev=>{if(ev.target.closest("button,a,input"))return;if(win.classList.contains("minimized")){win.classList.remove("minimized");saveWindowState({minimized:false,maximized:win.classList.contains("maximized")})}});$("win-maximize").onclick=()=>{const isMax=win.classList.toggle("maximized");if(isMax){maxRect={x:win.offsetLeft,y:win.offsetTop,w:win.offsetWidth,h:win.offsetHeight}}else if(maxRect){win.style.left=maxRect.x+"px";win.style.top=maxRect.y+"px";win.style.width=maxRect.w+"px";win.style.height=maxRect.h+"px"}saveWindowState({minimized:win.classList.contains("minimized"),maximized:isMax})};$("win-close").onclick=()=>{win.classList.add("hidden");fab.classList.remove("hidden");saveWindowState({closed:true})};fab.onclick=()=>{win.classList.remove("hidden");fab.classList.add("hidden");saveWindowState({closed:false})}}
