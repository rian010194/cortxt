services:
  egress-proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: ai-workspace/moonshot-egress-proxy-poc:1
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
      - /var/log/squid:size=16m,noexec,nosuid,nodev,uid=13,gid=13
      - /var/spool/squid:size=16m,noexec,nosuid,nodev,uid=13,gid=13
      - /run/squid:size=1m,noexec,nosuid,nodev,uid=13,gid=13
    networks:
      - builder_internal
      - proxy_external

  network-check:
    image: ai-workspace/pi-builder-poc:0.82.1
    depends_on:
      - egress-proxy
    entrypoint: ["node"]
    environment:
      NODE_USE_ENV_PROXY: "1"
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    networks:
      - builder_internal

  pi-builder-restricted:
    image: ai-workspace/pi-builder-poc:0.82.1
    depends_on:
      - egress-proxy
    environment:
      KIMI_API_KEY:
      NODE_USE_ENV_PROXY: "1"
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /pi-state:size=64m,noexec,nosuid,nodev,uid=1000,gid=1000
    volumes:
      - type: bind
        source: ./workspace
        target: /workspace
      - type: bind
        source: ./models.json
        target: /pi-state/models.json
        read_only: true
    networks:
      - builder_internal
    command:
      - --provider
      - moonshotai
      - --model
      - kimi-k2.6
      - -p
      - "Svara exakt: PI_KIMI_OK"

networks:
  builder_internal:
    internal: true
  proxy_external: {}
