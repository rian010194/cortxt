# Pi Builder Workspace Configuration
# Version: 0.1
# Description: Bounded workspace configuration for Pi Builder with vault access and egress rules

workspace:
  # Unique workspace identifier template
  id_template: "ws-{run_id}-{timestamp}"
  
  # Base directory for all workspaces
  base_dir: "/tmp/pi-workspaces"
  
  # Default workspace limits
  defaults:
    size_limit_mb: 500
    ttl_hours: 24
    cleanup_on_complete: true
    retain_artifacts: true

# Volume Mounts
# These define host-to-container volume mappings for bounded file access
volumes:
  # Obsidian Vault Access (CRITICAL for builder)
  - name: "obsidian-vault"
    source: "/home/rikar/Obsidian/Cortxt"      # Host path (Obsidian vault)
    target: "/host/vault"                      # Container path
    read_only: false                           # Builder needs write access
    required: true                             # Fail if not available
  
  # Input workspace (read-only reference data)
  - name: "workspace-input"
    source: "/tmp/pi-workspaces/{workspace_id}/input"
    target: "/workspace/input"
    read_only: true
    required: true
  
  # Output workspace (builder writes here)
  - name: "workspace-output"
    source: "/tmp/pi-workspaces/{workspace_id}/output"
    target: "/workspace/output"
    read_only: false
    required: true
  
  # Vertical package reference (read-only)
  - name: "vertical-package"
    source: "/tmp/pi-workspaces/{workspace_id}/vertical"
    target: "/workspace/vertical"
    read_only: true
    required: true
  
  # Artifacts directory (persisted after cleanup)
  - name: "workspace-artifacts"
    source: "/tmp/pi-workspaces/{workspace_id}/artifacts"
    target: "/workspace/artifacts"
    read_only: false
    required: true

# Egress Rules (Network Policy)
# Only explicitly allowed destinations can be reached from container
egress_rules:
  # Model APIs (REQUIRED for builder)
  - name: "openrouter-api"
    destination: "openrouter.ai"
    ports: [443]
    protocol: "tcp"
    required: true
    description: "OpenRouter model API (Nemotron, etc.)"
  
  - name: "moonshot-api"
    destination: "api.moonshot.ai"
    ports: [443]
    protocol: "tcp"
    required: true
    description: "Moonshot/Kimi model API"
  
  - name: "openrouter-model-inferx"
    destination: "model.inferx.net"
    ports: [443]
    protocol: "tcp"
    required: false
    description: "Custom OpenRouter endpoint (Nemotron flash)"
  
  # GitHub (REQUIRED for git operations, PR creation)
  - name: "github-api"
    destination: "api.github.com"
    ports: [443]
    protocol: "tcp"
    required: true
    description: "GitHub REST API"
  
  - name: "github-git"
    destination: "github.com"
    ports: [443, 22]
    protocol: "tcp"
    required: true
    description: "GitHub Git operations (HTTPS/SSH)"
  
  - name: "github-raw"
    destination: "raw.githubusercontent.com"
    ports: [443]
    protocol: "tcp"
    required: true
    description: "Raw GitHub content (schemas, templates)"
  
  # Codex App Server (for codex reviews if needed)
  - name: "codex-app-server"
    destination: "host.docker.internal"
    ports: [14535]
    protocol: "tcp"
    required: true
    description: "Codex App Server on host (for receptionist-codex)"
  
  # PyPI / Package managers (for dependency installation)
  - name: "pypi"
    destination: "pypi.org"
    ports: [443]
    protocol: "tcp"
    required: false
    description: "Python package index"
  
  - name: "pypi-files"
    destination: "files.pythonhosted.org"
    ports: [443]
    protocol: "tcp"
    required: false
    description: "PyPI package files"
  
  # NPM (if Node.js tools needed)
  - name: "npm-registry"
    destination: "registry.npmjs.org"
    ports: [443]
    protocol: "tcp"
    required: false
    description: "NPM package registry"
  
  # Linux package managers (apt, apk)
  - name: "debian-packages"
    destination: "deb.debian.org"
    ports: [80, 443]
    protocol: "tcp"
    required: false
    description: "Debian package repository"
  
  - name: "alpine-packages"
    destination: "dl-cdn.alpinelinux.org"
    ports: [80, 443]
    protocol: "tcp"
    required: false
    description: "Alpine Linux package repository"

# Resource Limits (per container)
resource_limits:
  default:
    cpus: "2"
    memory: "4g"
    pids_limit: 100
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
  
  # Profile-specific overrides
  profiles:
    builder:
      cpus: "2"
      memory: "4g"
      pids_limit: 100
    researcher:
      cpus: "1"
      memory: "2g"
      pids_limit: 50

# Security Settings
security:
  # Run as non-root user
  user: "1000:1000"
  
  # Read-only root filesystem (except mounted volumes)
  read_only_root_fs: true
  
  # Drop all capabilities except explicitly needed
  drop_capabilities:
    - "ALL"
  add_capabilities:
    - "CHOWN"
    - "DAC_OVERRIDE"
    - "FOWNER"
    - "SETGID"
    - "SETUID"
  
  # No new privileges
  no_new_privileges: true
  
  # Seccomp profile (default Docker)
  seccomp_profile: "default"
  
  # AppArmor profile (if available)
  apparmor_profile: "default"

# Container Image Configuration
image:
  # Default builder image
  default: "ghcr.io/rikar/pi-builder:kimi-latest"
  
  # Registry authentication
  registry:
    url: "ghcr.io"
    username: "rikar"
    # Token from credential-manager (vault path: pi/registry_token)
    token_vault_path: "pi/registry_token"
  
  # Platform
  platform: "linux/amd64"
  
  # Pull policy
  pull_policy: "always"  # Always pull latest for security updates

# Builder Runtime Configuration
builder:
  # Default command template
  command_template: |
    #!/bin/bash
    set -euo pipefail
    
    # Setup environment
    export RUN_ID="{run_id}"
    export ISSUE_REF="{issue_ref}"
    export VERTICAL="{vertical}"
    export MAX_COST_USD="{max_cost_usd}"
    export MAX_RUNTIME_SECONDS="{max_runtime_seconds}"
    export WORKSPACE_DIR="/workspace"
    
    # Run the task
    exec kimi --task "{task}" \
      --workspace /workspace/output \
      --input /workspace/input \
      --vertical /workspace/vertical \
      --max-cost {max_cost_usd} \
      --max-runtime {max_runtime_seconds}

  # Environment variables passed to container
  env_template:
    RUN_ID: "{run_id}"
    ISSUE_REF: "{issue_ref}"
    VERTICAL: "{vertical}"
    MAX_COST_USD: "{max_cost_usd}"
    MAX_RUNTIME_SECONDS: "{max_runtime_seconds}"
    KIMI_API_KEY: "{kimi_api_key}"  # From credential-manager
    OPENROUTER_API_KEY: "{openrouter_api_key}"
    GITHUB_TOKEN: "{github_token}"
    PYTHONPATH: "/workspace/vertical:/workspace"
    PYTHONUNBUFFERED: "1"

# Health Checks
health_check:
  # Startup probe (container ready)
  startup:
    initial_delay_seconds: 10
    period_seconds: 5
    timeout_seconds: 3
    failure_threshold: 30
    command: ["test", "-f", "/workspace/.ready"]
  
  # Liveness probe (container alive)
  liveness:
    initial_delay_seconds: 30
    period_seconds: 10
    timeout_seconds: 5
    failure_threshold: 3
    command: ["test", "-f", "/workspace/.alive"]
  
  # Readiness probe (can accept work)
  readiness:
    initial_delay_seconds: 5
    period_seconds: 5
    timeout_seconds: 3
    failure_threshold: 5
    command: ["test", "-f", "/workspace/.ready"]

# Logging Configuration
logging:
  # Container logs to stdout/stderr (captured by Docker)
  driver: "json-file"
  options:
    max_size: "10m"
    max_file: "3"
  
  # Structured logging format
  format: "json"
  include_timestamp: true
  include_level: true
  include_trace_id: true

# Monitoring & Metrics
monitoring:
  # Prometheus metrics endpoint (if builder exposes)
  metrics_port: 9090
  metrics_path: "/metrics"
  
  # Labels added to all metrics
  labels:
    service: "pi-builder"
    component: "builder"
    environment: "production"

# Cleanup Policy
cleanup:
  # Auto-cleanup after completion
  on_success:
    retain_artifacts: true
    retain_logs: true
    retain_workspace_hours: 24
  
  on_failure:
    retain_artifacts: true
    retain_logs: true
    retain_workspace_hours: 168  # 1 week for debugging
  
  on_timeout:
    retain_artifacts: true
    retain_logs: true
    retain_workspace_hours: 168

# Receptionist-Obsidian Configuration Update
# This updates the receptionist-obsidian to use the container mount path
receptionist_obsidian_update:
  config_path: "~/.hermes/receptionists/obsidian/config.yaml"
  updates:
    auth:
      type: "file_access"
      vault_path: "/host/vault"  # Container mount path
    # No other changes needed - same operations work

# Validation Checklist
# Run this after deployment to verify configuration
validation:
  checks:
    - name: "Obsidian vault accessible"
      command: "test -d /host/vault && test -w /host/vault"
      description: "Vault directory exists and is writable"
    
    - name: "Egress to OpenRouter"
      command: "curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://openrouter.ai/api/v1/models | grep -q '^200$'"
      description: "Can reach OpenRouter API"
    
    - name: "Egress to Moonshot"
      command: "curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://api.moonshot.ai/v1/models | grep -q '^200$'"
      description: "Can reach Moonshot API"
    
    - name: "Egress to GitHub"
      command: "curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://api.github.com/user | grep -q '^200$'"
      description: "Can reach GitHub API"
    
    - name: "Egress to Codex App Server"
      command: "curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://host.docker.internal:14535/health | grep -q '^200$'"
      description: "Can reach Codex App Server on host"
    
    - name: "Volume mounts present"
      command: "mountpoint -q /host/vault && mountpoint -q /workspace/input && mountpoint -q /workspace/output"
      description: "All required volumes mounted"
    
    - name: "Egress rules enforced"
      command: "curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://example.com | grep -q '^000$'"
      description: "Non-allowed destinations blocked"

---
# End of Pi Workspace Configuration