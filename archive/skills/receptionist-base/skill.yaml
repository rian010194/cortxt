name: "receptionist-base"
version: "0.1.0"
maturity: "experimental"
category: "software-development"
description: "Generic base skill for system receptionists providing CRUD, auth, rate-limiting, caching, and error handling"
author: "Cortxt"
license: "MIT"
depends_on:
  - name: "credential-manager"
    version: ">=0.1.0"
    required: true
interface:
  input_schema: "receptionist-base.input.schema.json"
  output_schema: "receptionist-base.output.schema.json"
  error_codes: "receptionist-base.errors.schema.json"
  openapi: "receptionist-base.openapi.yaml"
error_taxonomy:
  transient:
    - "RATE_LIMITED"
    - "UPSTREAM_ERROR"
    - "TIMEOUT"
    - "AUTH_EXPIRED"
  permanent:
    - "VALIDATION_ERROR"
    - "PERMISSION_DENIED"
    - "NOT_FOUND"
    - "VAULT_NOT_FOUND"
  retry_policy:
    transient:
      max_attempts: 3
      base_delay_ms: 500
      max_delay_ms: 10000
      backoff: "exponential"
    permanent:
      max_attempts: 0
compatibility:
  breaking_changes: []
  deprecated_in: null
  removed_in: null
observability:
  metrics:
    - "request.total"
    - "request.duration_ms"
    - "request.success"
    - "request.error"
    - "rate_limit.remaining"
    - "cache.hit"
    - "cache.miss"
  traces: true
  logs: "structured-json"
interface_files:
  typescript: "interfaces/receptionist-base.ts"
  openapi: "openapi/receptionist-base.yaml"
  json_schemas:
    - "schemas/receptionist-base.input.schema.json"
    - "schemas/receptionist-base.output.schema.json"
    - "schemas/receptionist-base.errors.schema.json"
  python_stubs: "stubs/receptionist-base.pyi"