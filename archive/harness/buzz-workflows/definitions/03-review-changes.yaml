name: vertical_01_review_changes
description: Return requested review changes to Coordinator for redispatch.
enabled: false
trigger:
  on: message_posted
  filter: 'str_starts_with(trigger_text, "[REVIEW_CHANGES_REQUIRED]")'
steps:
  - id: return_findings
    name: Return review findings
    timeout_secs: 30
    action: send_message
    text: |
      @Coordinator Review requested changes. Convert the findings into a new,
      complete dispatch request. Preserve issue_id, create a new run_id for a
      retry, and emit [BUILD_READY] only when the GitHub issue remains approved
      and Ready for redispatch.

      Findings:
      Trigger message ID: {{trigger.message_id}}
      {{trigger.text}}
