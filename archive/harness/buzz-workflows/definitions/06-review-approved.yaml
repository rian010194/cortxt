name: vertical_01_review_approved
description: Notify Coordinator that independent review approved a milestone.
enabled: false
trigger:
  on: message_posted
  filter: 'str_starts_with(trigger_text, "[REVIEW_APPROVED]")'
steps:
  - id: notify_approval
    name: Record review approval
    timeout_secs: 30
    action: send_message
    text: |
      @Coordinator Independent review approved the milestone. Record the
      evidence against the GitHub issue and request operator approval. Do not
      move the issue to Done, merge, publish, or deploy autonomously.

      Review result:
      Trigger message ID: {{trigger.message_id}}
      {{trigger.text}}
