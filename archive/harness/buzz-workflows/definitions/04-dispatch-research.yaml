name: vertical_01_dispatch_research
description: Route one bounded primary-source question to Researcher.
enabled: false
trigger:
  on: message_posted
  filter: 'str_starts_with(trigger_text, "[RESEARCH_REQUEST]")'
steps:
  - id: dispatch_researcher
    name: Dispatch bounded legal research
    timeout_secs: 30
    action: send_message
    text: |
      @Researcher Verify only the bounded legal question below against the
      primary EUR-Lex source. Return the exact article or annex, source URI,
      verification date and legal-act version, concise conclusion, affected
      requirement_id/schema field/fixture/eval, and remaining uncertainty.
      Start the response with [RESEARCH_COMPLETE].

      Research request:
      Trigger message ID: {{trigger.message_id}}
      {{trigger.text}}
