  decision_brief:
    language: sv
    text: "Systemet CrowdCount AI kan omfattas av AI-förordningen, men riskklassificeringen är osäker. Det är oklart om silhouettbaserad trängselräkning över huvud taget utgör biometrisk behandling enligt Art 3(34)/GDPR Art 4(11), eftersom den varken identifierar individer eller lagrar ansiktsdata. Avgörs det att tekniken är biometrisk återstår Annex III-gränsen. Primärkällsverifiering krävs."
  uncertainties:
  - topic: Whether silhouette crowd-counting constitutes biometric processing (AI Act Art 3(34)/GDPR Art 4(11))
    reason: The decision to treat silhouettes as biometric data is not yet established. Biometric data under Art 3(34) requires data relating to physical characteristics that allow or confirm the UNIQUE identification of a natural person; this system neither identifies nor stores facial data. It is therefore uncertain whether silhouette-based crowd counting constitutes biometric processing at all.
    suggested_research: Verify whether silhouette-based crowd counting falls within biometric data as defined by AI Act Art 3(34) and GDPR Art 4(11), absent individual identification.
  - topic: Annex III point 1(a) vs point 1(b) (only if biometric processing is established)
    reason: IF the technique is determined to be biometric processing, it is further unclear whether it performs biometric identification (point 1(a)) or biometric categorisation (point 1(b)) under Annex III. The claim of no individual identification is relevant but not decisive.
    suggested_research: Confirm the Annex III point 1(a)/1(b) classification for biometric crowd counting once the biometric-data premise is resolved.
  - topic: Article 3(1) AI definition for silhouette detection
    reason: The underlying model may use machine learning or traditional computer vision. The AI definition boundary is unclear without architecture details.
    suggested_research: Confirm whether silhouette-detection models typically qualify as AI systems under Article 3(1).
