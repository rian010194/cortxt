contract_version: "0.1"
widget:
  id: candidates
  version: "0.1"
  title: Candidates
data:
  reads:
    - id: candidates
      source: github
      operation: candidates.view.v1
      input:
        repo: owner/repo
      select: []
      refresh:
        mode: manual
      output_type: candidates.view.v1
      on_error: stale
render:
  primitive: stack
  props: {label: Candidates}
  children:
    - primitive: key-value
      bindings: {value: {read: candidates, pointer: /source, type: core.object.v1}}
    - primitive: metric
      props: {label: Total}
      bindings: {value: {read: candidates, pointer: /total, type: core.number.v1}}
    - primitive: table
      props: {label: frontier, columns: [number, title, workflow, area, milestone, open_blocker_count]}
      bindings: {rows: {read: candidates, pointer: /groups/0/rows, type: core.array.v1}}
    - primitive: table
      props: {label: in_progress, columns: [number, title, workflow, area, milestone, open_blocker_count]}
      bindings: {rows: {read: candidates, pointer: /groups/1/rows, type: core.array.v1}}
    - primitive: table
      props: {label: blocked, columns: [number, title, workflow, area, milestone, open_blocker_count]}
      bindings: {rows: {read: candidates, pointer: /groups/2/rows, type: core.array.v1}}
    - primitive: table
      props: {label: other, columns: [number, title, workflow, area, milestone, open_blocker_count]}
      bindings: {rows: {read: candidates, pointer: /groups/3/rows, type: core.array.v1}}
    - primitive: table
      props: {label: violations, columns: [number, title, workflow, area, milestone, open_blocker_count]}
      bindings: {rows: {read: candidates, pointer: /groups/4/rows, type: core.array.v1}}
    - primitive: table
      props: {label: atlas_maps, columns: [number, title, workflow, area, milestone, open_blocker_count]}
      bindings: {rows: {read: candidates, pointer: /groups/5/rows, type: core.array.v1}}
actions:
  - id: mark-ready
    port: github-transition
    operation: workflow.mark-ready.v1
    input:
      issue_id: "owner/repo#0"
    authorization:
      mode: operator
      reference: "operator-approval"
    confirm:
      summary: "Move the issue from workflow:inbox to workflow:ready"
      effect_class: workflow-transition
      required: true
    result_type: action.status.v1
    idempotency_key: "mark-ready"
  - id: claim-run
    port: cli
    operation: workflow.claim-run.v1
    input:
      issue_id: "owner/repo#0"
    authorization:
      mode: operator
      reference: "operator-approval"
    confirm:
      summary: "Claim and run the issue through the execution map"
      effect_class: run-dispatch
      required: true
    result_type: action.status.v1
    idempotency_key: "claim-run"
capabilities: [read:issues, act:mark-ready, act:claim-run]
