<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cortxt</title>
<style>
:root{color-scheme:dark;--layer:#ffffff0d;--hover:#ffffff15;--stroke:#ffffff17;--strong:#ffffff26;--text:#fffffff0;--muted:#ffffff9e;--dim:#ffffff6b;--accent:#60cdff;--blue:#0f6cbd;--ok:#6ccb5f;--warn:#ffb900;--bad:#ff99a4;--sans:"Segoe UI Variable","Segoe UI",sans-serif;--mono:"Cascadia Mono",Consolas,monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 25% 15%,#29303a,#111 58%);font-family:var(--sans);color:var(--text)}button,select{font:inherit}.window{width:460px;max-width:calc(100vw - 20px);height:520px;border:1px solid var(--strong);border-radius:8px;overflow:hidden;background:#202020b8;backdrop-filter:blur(30px) saturate(150%);box-shadow:0 32px 64px #0009,0 1px #ffffff0c inset}.titlebar{height:32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--stroke);background:#ffffff05}.identity{display:flex;align-items:center;gap:8px;padding-left:10px}.icon{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--blue));color:#06263b;font-size:10px;font-weight:700}.appname{font-size:12px;color:var(--muted)}.caption{height:100%;display:flex}.caption button{width:44px;border:0;background:transparent;color:var(--muted);font-size:10px}.caption button:hover{background:var(--hover);color:var(--text)}.caption .close:hover{background:#c42b1c}.tabs{height:38px;padding:0 14px;display:flex;gap:18px;border-bottom:1px solid var(--stroke)}.tabs button{height:100%;padding:0 2px;border:0;background:transparent;color:var(--muted);font-size:12.5px;position:relative}.tabs button.active{color:var(--text)}.tabs button.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}.content{height:449px;padding:15px 16px 13px}.tab{height:100%;display:flex;flex-direction:column}.hidden{display:none}.eyebrow{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.title{font-size:13px;line-height:1.35;margin-top:3px;max-width:310px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:600;background:#60cdff20;color:var(--accent)}.badge:before{content:"●"}.badge.running:before{animation:pulse 1.4s ease-in-out infinite}.badge.succeeded{background:#6ccb5f20;color:var(--ok)}.badge.succeeded:before{content:"✓"}.badge.failed,.badge.timed_out{background:#ff99a420;color:var(--bad)}.badge.blocked,.badge.attention{background:#ffb90020;color:var(--warn)}.badge.abandoned{background:#ffffff12;color:var(--dim)}.badge.abandoned:before{content:"◌"}@keyframes pulse{50%{opacity:.3}}.switcher{margin-top:10px;width:100%;border:1px solid var(--stroke);border-radius:5px;background:#292929;color:var(--muted);padding:5px 7px;font-size:11px;outline:0}.lanes{margin-top:14px;flex:1;min-height:0;overflow:auto}.axis,.lane{display:grid;grid-template-columns:74px 1fr}.ticks{height:15px;display:flex;justify-content:space-between;color:var(--dim);font:9px var(--mono)}.lane{min-height:31px;align-items:center}.lane-name{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:7px}.track{height:25px;position:relative}.track:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--stroke)}.segment{position:absolute;top:9px;height:7px;min-width:5px;border-radius:4px;background:var(--blue)}.segment.running{background:linear-gradient(90deg,var(--blue),var(--accent));box-shadow:0 0 8px #60cdff77}.segment.succeeded{background:var(--ok)}.segment.blocked{background:var(--warn)}.segment.failed,.segment.timed_out{background:var(--bad)}.segment.abandoned{background:repeating-linear-gradient(135deg,var(--dim) 0,var(--dim) 3px,transparent 3px,transparent 6px);opacity:.8}.footer{display:flex;align-items:flex-end;justify-content:space-between;border-top:1px solid var(--stroke);padding-top:11px}.chips{display:flex;gap:5px}.chip{padding:4px 7px;border:1px solid var(--stroke);border-radius:5px;background:var(--layer);color:var(--muted);font-size:10.5px}.chip b{font:600 10.5px var(--mono);color:var(--text)}.empty{margin:auto;padding:18px;text-align:center;color:var(--dim);font-size:11.5px;border:1px dashed var(--stroke);border-radius:7px;width:100%}.feed,.fleet{margin-top:8px;min-height:0;overflow:auto}.event{display:grid;grid-template-columns:43px 1fr;gap:9px;padding:9px 0;border-bottom:1px solid var(--stroke)}.event time{font:9.5px var(--mono);color:var(--dim)}.event strong{display:block;font-size:11.5px}.event p{margin:2px 0 0;color:var(--muted);font-size:11px}.event span{font-size:9px;color:var(--accent);text-transform:uppercase}.section-label{margin:10px 0 6px}.group{border:1px solid var(--stroke);border-radius:7px;overflow:hidden;background:var(--layer)}.row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-bottom:1px solid var(--stroke)}.row:last-child{border-bottom:0}.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}.dot.running{background:var(--ok);box-shadow:0 0 5px var(--ok)}.dot.loaded{background:var(--accent)}.row-main{flex:1;min-width:0}.row-title{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-sub{font-size:9.5px;color:var(--dim);margin-top:1px}.trail{font:9.5px var(--mono);color:var(--muted)}.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.skill{padding:6px 7px;border:1px solid var(--stroke);border-radius:5px;background:var(--layer);min-width:0}.skill-name{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.skill-state{font-size:9px;color:var(--dim);margin-top:2px}.gauge{display:flex;align-items:center;gap:9px;margin-top:10px}.gauge-track{height:4px;background:var(--layer);border-radius:2px;flex:1}.offline{color:var(--bad)}
</style></head><body><div class="window"><div class="titlebar"><div class="identity"><div class="icon">C</div><div class="appname">Cortxt</div></div><div class="caption"><button>—</button><button>□</button><button class="close">✕</button></div></div><div class="tabs"><button class="active" data-tab="pipeline">Pipeline</button><button data-tab="logg">Logg</button><button data-tab="flotta">Flotta</button></div><div class="content">
<section id="pipeline" class="tab"><div class="head"><div><div id="pipeline-eye" class="eyebrow">Orchestrator · väntar</div><div id="pipeline-title" class="title">Ingen workstream vald</div></div><span id="pipeline-badge" class="badge">väntar</span></div><select id="workstream-select" class="switcher" aria-label="Workstream"></select><div id="lanes" class="lanes"></div><div class="footer"><div class="chips"><div class="chip">kostnad <b>—</b></div><div class="chip">tid <b id="elapsed">—</b></div><div class="chip">tok <b>—</b></div></div><div id="snapshot-time" class="eyebrow">ingen snapshot</div></div></section>
<section id="logg" class="tab hidden"><div class="head"><div><div class="eyebrow">Händelser</div><div class="title">Payload-fri aktivitetslogg</div></div><span id="event-count" class="badge">0</span></div><div id="feed" class="feed"></div></section>
<section id="flotta" class="tab hidden"><div class="head"><div><div class="eyebrow">Agenter · runtimes · skills</div><div class="title">Flotta och kapabiliteter</div></div><span id="fleet-count" class="badge">0</span></div><div class="fleet"><div class="eyebrow section-label">Hermes-profiler</div><div id="profiles" class="group"></div><div class="eyebrow section-label">Runtimes</div><div id="runtimes" class="group"></div><div class="eyebrow section-label">Skills</div><div id="skills" class="skill-grid"></div><div class="gauge"><div class="eyebrow">Budget</div><div class="gauge-track"></div><div class="trail">telemetri saknas</div></div></div></section>
</div></div>
<script>
const $=id=>document.getElementById(id);let doc={},selected=null;const set=(id,v)=>$(id).textContent=v??"";const stateList=x=>["installed","available","loaded","running"].filter(k=>x?.[k]);document.querySelectorAll(".tabs button").forEach(button=>button.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active",x===button));["pipeline","logg","flotta"].forEach(id=>$(id).classList.toggle("hidden",id!==button.dataset.tab))});
function empty(root,message){root.replaceChildren();const node=document.createElement("div");node.className="empty";node.textContent=message;root.append(node)}function badge(status){const b=$("pipeline-badge");b.className=`badge ${status||""}`;b.textContent=status||"okänd"}
function renderWorkstreams(){const items=doc.workstreams||[],select=$("workstream-select");select.replaceChildren();if(!items.length){const o=document.createElement("option");o.textContent="Inga workstreams";select.append(o);selected=null;renderPipeline();return}if(!selected||!items.some(x=>x.workstream_id===selected))selected=items[0].workstream_id;items.forEach(item=>{const o=document.createElement("option");o.value=item.workstream_id;o.textContent=`${item.workspace?.branch||item.workstream_id} · ${item.status}`;o.selected=item.workstream_id===selected;select.append(o)});select.onchange=()=>{selected=select.value;renderPipeline();renderLog()};renderPipeline()}
function renderPipeline(){const ws=(doc.workstreams||[]).find(x=>x.workstream_id===selected),root=$("lanes");if(!ws){set("pipeline-eye","Orchestrator · idle");set("pipeline-title","Ingen workstream vald");badge("idle");empty(root,"Kör `cortxt orchestrator` för att skapa en snapshot.");set("elapsed","—");return}set("pipeline-eye",`${ws.issue_id||"workstream"} · ${ws.workspace?.branch||"ingen branch"}`);set("pipeline-title",ws.workstream_id);badge(ws.status);root.replaceChildren();
// A missing finished_at ("still open") only means "extends to now" for a
// segment that is actually still running. An abandoned/terminal segment's
// finished_at is always concrete (the backend caps it at its own
// last-known-activity time) -- but this stays defensive here too, so a
// stray null on a non-running segment falls back to its own start instead
// of silently dragging the whole axis (and every other lane) out to "now".
const segmentEnd=s=>Date.parse(s.finished_at||(s.state==="running"?new Date():s.started_at));
const segments=ws.lanes.flatMap(l=>l.segments||[]),times=segments.flatMap(s=>[Date.parse(s.started_at),segmentEnd(s)]).filter(Number.isFinite),min=times.length?Math.min(...times):0,max=times.length?Math.max(...times):1,span=Math.max(1,max-min);const axis=document.createElement("div");axis.className="axis";axis.innerHTML='<div></div><div class="ticks"><span>start</span><span>25%</span><span>50%</span><span>75%</span><span>nu</span></div>';root.append(axis);ws.lanes.forEach(lane=>{const row=document.createElement("div");row.className="lane";const name=document.createElement("div");name.className="lane-name";name.textContent=`${lane.label} · ${lane.runtime||"?"}`;name.title=`${lane.label} · ${lane.runtime||"runtime okänd"} · ${lane.status}`;const track=document.createElement("div");track.className="track";(lane.segments||[]).forEach(s=>{const start=Date.parse(s.started_at),end=segmentEnd(s);const bar=document.createElement("span");bar.className=`segment ${s.state}`;bar.style.left=`${(start-min)/span*100}%`;bar.style.width=`${Math.max(1,(end-start)/span*100)}%`;bar.title=s.state==="abandoned"?`abandoned: senast aktiv ${s.finished_at||s.started_at}`:`${s.state}: ${s.started_at} → ${s.finished_at||"nu"}`;track.append(bar)});row.append(name,track);root.append(row)});set("elapsed",times.length?duration(max-min):"—")}function duration(ms){const s=Math.max(0,Math.round(ms/1000));return s<60?`${s}s`:`${Math.floor(s/60)}m ${s%60}s`}
function renderLog(){const items=(doc.activity||[]).filter(x=>!selected||x.workstream_id===selected),root=$("feed");set("event-count",items.length);if(!items.length){empty(root,"Ingen payload-fri eventhistorik finns för denna workstream.");return}root.replaceChildren();items.slice(0,40).forEach(item=>{const n=document.createElement("div");n.className="event";const d=new Date(item.timestamp);n.innerHTML='<time></time><div><strong></strong><p></p><span></span></div>';n.querySelector("strong").textContent=item.actor||item.runtime||"agent";n.querySelector("p").textContent=item.workstream_id||"utan workstream";n.querySelector("span").textContent=item.event_type;n.querySelector("time").textContent=Number.isNaN(d.valueOf())?"—":d.toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"});n.querySelector("time").dateTime=item.timestamp;root.append(n)})}
function renderFleet(){const profiles=doc.profiles||[],runtimes=doc.runtimes||[],skills=doc.skills||[];set("fleet-count",profiles.filter(x=>x.running).length+runtimes.filter(x=>x.running).length);const pr=$("profiles");if(!profiles.length)empty(pr,"Hermes-profilmetadata saknas");else{pr.replaceChildren();profiles.forEach(p=>pr.append(fleetRow(p.profile_id,p.model,p.running?"kör":p.loaded?"laddad":"stoppad",p.running,p.loaded)))}const rr=$("runtimes");if(!runtimes.length)empty(rr,"Runtime-inventering saknas");else{rr.replaceChildren();runtimes.forEach(r=>rr.append(fleetRow(r.runtime_id,stateList(r).join(" · ")||"saknas","",r.running,r.loaded)))}const sr=$("skills");if(!skills.length)empty(sr,"Skillmetadata saknas");else{sr.replaceChildren();skills.forEach(s=>{const item=document.createElement("div");item.className="skill";const name=document.createElement("div");name.className="skill-name";name.textContent=s.skill_id;name.title=`${s.skill_id} · ${(s.sources||[]).join(", ")}`;const state=document.createElement("div");state.className="skill-state";state.textContent=stateList(s).join(" · ")||"metadata";item.append(name,state);sr.append(item)})}}
function fleetRow(titleText,subText,trailText,running,loaded){const row=document.createElement("div");row.className="row";const dot=document.createElement("i");dot.className=`dot ${running?"running":loaded?"loaded":""}`;const main=document.createElement("div");main.className="row-main";const title=document.createElement("div");title.className="row-title";title.textContent=titleText;const sub=document.createElement("div");sub.className="row-sub";sub.textContent=subText||"metadata saknas";main.append(title,sub);const trail=document.createElement("div");trail.className="trail";trail.textContent=trailText;row.append(dot,main,trail);return row}
function render(data){doc=data;renderWorkstreams();renderLog();renderFleet();const t=new Date(doc.generated_at);set("snapshot-time",Number.isNaN(t.valueOf())?"snapshot okänd":t.toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"}))}async function poll(){try{const r=await fetch("snapshot.json",{cache:"no-store"});if(!r.ok)throw Error(r.status);render(await r.json())}catch(e){set("pipeline-eye","Orchestrator · offline");$("pipeline-eye").classList.add("offline");badge("failed");set("snapshot-time","offline")}}poll();setInterval(poll,3000);
</script></body></html>
