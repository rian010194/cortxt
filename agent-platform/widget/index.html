<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cortxt</title>
<style>
:root{color-scheme:dark;--layer:#ffffff0d;--hover:#ffffff15;--stroke:#29324a;--strong:#3a4562;--text:#f4f7ff;--muted:#aab3c5;--dim:#8792a8;--accent:#4d6bfe;--blue:#3151d8;--ok:#68d391;--warn:#f6c85f;--bad:#ff7a90;--sans:Inter,"Segoe UI Variable","Segoe UI",sans-serif;--mono:"Cascadia Code","Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 24% 12%,#202b50 0,#0d1220 40%,#080b14 75%);font-family:var(--sans);color:var(--text)}
button,select{font:inherit}
.window{width:460px;max-width:calc(100vw - 20px);height:520px;border:1px solid var(--strong);border-radius:14px;overflow:hidden;background:#101522d9;backdrop-filter:blur(30px) saturate(150%);box-shadow:0 32px 80px #000a,0 1px #ffffff0c inset;display:flex;flex-direction:column}
.titlebar{height:32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--stroke);background:#ffffff05;flex:none}
.identity{display:flex;align-items:center;gap:8px;padding-left:10px}
.icon{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--blue));color:#06263b;font-size:10px;font-weight:700}
.appname{font-size:12px;color:var(--muted)}
.tabs{height:38px;padding:0 14px;display:flex;gap:18px;border-bottom:1px solid var(--stroke);flex:none;overflow-x:auto}
.tabs button{height:100%;padding:0 2px;border:0;background:transparent;color:var(--muted);font-size:12.5px;position:relative;white-space:nowrap}
.tabs button.active{color:var(--text)}
.tabs button.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.content{flex:1;min-height:0;padding:15px 16px 13px;overflow:auto}
.tab{display:flex;flex-direction:column;gap:8px}
.hidden{display:none}
.eyebrow{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.title{font-size:13px;line-height:1.35;margin-top:3px;max-width:330px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:600;background:#4d6bfe22;color:var(--accent);flex:none}
.badge:before{content:"●"}
.badge.ok{background:#68d39120;color:var(--ok)}
.badge.err{background:#ff7a9020;color:var(--bad)}
.badge.off{background:#ffffff12;color:var(--dim)}
.empty{margin:auto;padding:18px;text-align:center;color:var(--dim);font-size:11.5px;border:1px dashed var(--stroke);border-radius:7px;width:100%}
.pulse-status{margin:0;padding:7px 9px;border:1px solid var(--stroke);border-radius:6px;color:var(--muted);font-size:10.5px}
.pulse-status.error{color:var(--bad)}
.candidate-group{margin:6px 0}
.candidate-group h3{margin:0 0 5px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.candidate-table{width:100%;border-collapse:collapse;font-size:10px}
.candidate-table th,.candidate-table td{padding:5px 6px;border-bottom:1px solid var(--stroke);text-align:left;vertical-align:top}
.candidate-table th{color:var(--dim);font-weight:500}
.candidate-table td:nth-child(2){max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.candidate-chain{margin:0;padding:6px 9px;border:1px solid var(--stroke);border-radius:6px;background:var(--layer);font-size:10px;color:var(--muted)}
.candidate-chain b{color:var(--text);font-weight:600}
.candidate-action{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.candidate-copy{border:1px solid var(--strong);border-radius:5px;background:var(--layer);color:var(--accent);font-size:10px;padding:3px 7px;cursor:pointer}
.candidate-copy:hover{background:var(--hover)}
.candidate-copy.copied{color:var(--ok)}
.candidate-cmd{font:9.5px var(--mono);color:var(--dim);border:1px solid var(--stroke);border-radius:4px;background:#0d1220;padding:2px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pulse-stat{padding:6px 7px;border:1px solid var(--stroke);border-radius:6px;background:var(--layer);min-width:0}
.pulse-stat b{display:block;font:600 13px var(--mono);color:var(--text)}
.pulse-stat span{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-bottom:1px solid var(--stroke)}
.row-main{flex:1;min-width:0}
.row-title{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.action-form{margin:2px 0 4px;padding:5px 6px;border:1px solid var(--stroke);border-radius:5px;background:var(--layer);display:flex;flex-direction:column;gap:4px;min-width:200px}
.action-form label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.action-ref{width:100%;font:10px var(--mono);background:#0d1220;border:1px solid var(--strong);border-radius:4px;color:var(--text);padding:3px 5px}
.action-confirm-row{display:flex;gap:5px;align-items:center;font-size:9.5px;color:var(--muted)}
.action-run{border:1px solid var(--accent);border-radius:5px;background:#0d1220;color:var(--accent);font-size:10px;padding:3px 8px;cursor:pointer}
.action-run:disabled{opacity:.4;cursor:not-allowed}
.action-run.running{color:var(--warn)}
.action-result{margin-top:3px;font-size:9.5px;color:var(--muted);word-break:break-word}
.action-result.ok{color:var(--ok)}
.action-result.denied{color:var(--bad)}
.action-result.error{color:var(--warn)}
</style></head><body><div class="window">
<div class="titlebar"><div class="identity"><div class="icon">C</div><div class="appname">Cortxt</div></div></div>
<div class="tabs" id="tabs"></div>
<div class="content" id="content"></div>
</div>
<script>
const $=id=>document.getElementById(id);
function empty(root,message){root.replaceChildren();const n=document.createElement("div");n.className="empty";n.textContent=message;root.append(n)}
function emptyLine(message){const n=document.createElement("div");n.className="empty";n.textContent=message;return n}
let actionHost={enabled:false,token:null,actions:[]},actionState=new Map();
async function probeActions(){try{const r=await fetch("api/token",{cache:"no-store"});if(!r.ok)throw Error(r.status);const t=await r.json();const c=await (await fetch("api/capabilities",{cache:"no-store"})).json();actionHost={enabled:true,token:t.token||"",actions:c.actions||[]}}catch(e){actionHost={enabled:false,token:null,actions:[]}}}
function copyCommand(text,button){const done=()=>{button.textContent="Copied";button.classList.add("copied");setTimeout(()=>{button.textContent="Copy command";button.classList.remove("copied")},1500)};if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done))}else{fallbackCopy(text,done)}}
function fallbackCopy(text,done){const area=document.createElement("textarea");area.value=text;area.style.position="fixed";area.style.opacity="0";document.body.append(area);area.select();try{document.execCommand("copy");done()}catch(e){}area.remove()}
async function runAction(button,handoff,issueId){const form=button.closest(".action-form"),ref=form?.querySelector(".action-ref")?.value.trim()||"",box=form?.querySelector(".action-confirm"),resultNode=form?.querySelector(".action-result"),key=`${handoff.id}:${issueId}`,persist=()=>actionState.set(key,{ref:form?.querySelector(".action-ref")?.value||"",checked:!!box?.checked,result:resultNode?.textContent||"",cls:resultNode?.className||"action-result"});if(!form||!ref||!box?.checked){resultNode.className="action-result denied";resultNode.textContent="approval reference and confirm are required";persist();return}button.disabled=true;button.textContent="running…";button.classList.add("running");resultNode.className="action-result";resultNode.textContent="dispatching…";try{const response=await fetch("api/action",{method:"POST",headers:{"Content-Type":"application/json","X-Cortxt-Token":actionHost.token},body:JSON.stringify({action_id:handoff.id,issue_id:issueId,approval_ref:ref,confirm:true})});const data=await response.json();if(response.ok&&data.status==="ok"){resultNode.className="action-result ok";resultNode.textContent=`ok · ${data.result?.status||"done"}`;box.checked=false}else{const err=data.error||{};resultNode.className=err.kind==="authorization_denied"?"action-result denied":"action-result error";resultNode.textContent=`${err.kind||"error"}${err.code?` · ${err.code}`:""}${err.message?` · ${err.message}`:""}`}}catch(e){resultNode.className="action-result error";resultNode.textContent=`action_error · ${e.message||"request failed"}`}finally{button.disabled=false;button.textContent="Execute";button.classList.remove("running");persist()}}
function actionForm(handoff,issueId){const form=document.createElement("div");form.className="action-form";const label=document.createElement("label");label.textContent=`${handoff.id} · ${handoff.effect_class||handoff.operation||""}`;const ref=document.createElement("input");ref.className="action-ref";ref.type="text";ref.placeholder="approval reference";ref.autocomplete="off";ref.spellcheck=false;const row=document.createElement("div");row.className="action-confirm-row";const box=document.createElement("input");box.type="checkbox";box.className="action-confirm";const note=document.createElement("span");note.textContent=handoff.confirm?.summary||"confirm the declared effect";const run=document.createElement("button");run.className="action-run";run.textContent="Execute";run.disabled=true;const result=document.createElement("div");result.className="action-result";const key=`${handoff.id}:${issueId}`,saved=actionState.get(key)||{};ref.value=saved.ref||"";box.checked=!!saved.checked;const update=()=>{run.disabled=!ref.value.trim()||!box.checked;actionState.set(key,{ref:ref.value,checked:box.checked,result:result.textContent,cls:result.className})};ref.oninput=update;box.onchange=update;run.onclick=()=>runAction(run,handoff,issueId);row.append(box,note);form.append(label,ref,row,run,result);if(saved.result){result.textContent=saved.result;result.className=saved.cls||"action-result"}update();return form}
function renderGenericNode(node,container){if(!node)return;const p=node.props||{};if(node.primitive==="stack"||node.primitive==="row"||node.primitive==="grid"||node.primitive==="panel"){(node.children||[]).forEach(child=>renderGenericNode(child,container));return}if(node.primitive==="heading"||node.primitive==="text"||node.primitive==="badge"){const el=document.createElement("div");el.className=node.primitive==="heading"?"pulse-status":node.primitive==="badge"?"candidate-copy":"pulse-status";el.textContent=p.value??p.label??"";container.append(el);return}if(node.primitive==="metric"){const stat=document.createElement("div");stat.className="pulse-stat";const b=document.createElement("b");b.textContent=p.value??"—";const span=document.createElement("span");span.textContent=p.label||"";stat.append(b,span);container.append(stat);return}if(node.primitive==="key-value"){const block=document.createElement("div");block.className="pulse-status";block.textContent=typeof p.value==="object"&&p.value!==null?JSON.stringify(p.value):p.value??"";container.append(block);return}if(node.primitive==="table"){const rows=p.rows||[];const group=document.createElement("div");group.className="candidate-group";const heading=document.createElement("h3");heading.textContent=`${p.label||"Table"} (${rows.length})`;group.append(heading);if(!rows.length){group.append(emptyLine("No rows."));container.append(group);return}const table=document.createElement("table");table.className="candidate-table";const columns=p.columns||[];const head=document.createElement("tr");columns.forEach(column=>{const th=document.createElement("th");th.textContent=column.replaceAll("_"," ");head.append(th)});const thead=document.createElement("thead");thead.append(head);const body=document.createElement("tbody");rows.forEach(item=>{const row=document.createElement("tr");columns.forEach(column=>{const cell=document.createElement("td");const value=item[column];cell.textContent=typeof value==="object"&&value!==null?JSON.stringify(value):value??"—";row.append(cell)});body.append(row)});table.append(thead,body);group.append(table);container.append(group);return}if(node.primitive==="list"){const group=document.createElement("div");group.className="candidate-group";const heading=document.createElement("h3");heading.textContent=p.label||"List";group.append(heading);const items=p.items||[];if(!items.length){group.append(emptyLine(p.empty||"No items."));container.append(group);return}items.forEach(item=>{const row=document.createElement("div");row.className="row";const main=document.createElement("div");main.className="row-main";const title=document.createElement("div");title.className="row-title";title.textContent=typeof item==="object"&&item!==null?JSON.stringify(item):item;main.append(title);row.append(main);group.append(row)});container.append(group);return}if(node.primitive==="empty-state"||node.primitive==="error-state"){container.append(emptyLine(p.message||(node.primitive==="error-state"?"Error":"Empty")));return}if(node.primitive==="divider"||node.primitive==="spacer"){return}container.append(emptyLine(`Unhandled primitive: ${node.primitive}`))}
function renderActionable(tree,root){const nodes=tree?.render?.children||[],tables=nodes.filter(x=>x.primitive==="table"),handoffs=tree?.handoffs||[],enabledHandoffs=handoffs.filter(x=>x.enabled),repo=tree.repo||"OWNER/REPO";const total=tables.reduce((sum,x)=>sum+(x.props?.rows||[]).length,0);if(enabledHandoffs.length){const chain=document.createElement("div");chain.className="candidate-chain";chain.textContent=handoffs.map(x=>x.enabled?`${x.id} (${x.effect_class})`:`${x.id} (off)`).join(" → ");chain.append(actionHost.enabled?" — operator-gated: type the approval reference and confirm in the browser":" — Copy command copies the operator-gated command; approve in the terminal");root.append(chain)}if(!total){root.append(emptyLine("No rows."));return}tables.forEach(node=>{const rows=node.props?.rows||[];if(!rows.length)return;const group=document.createElement("div");group.className="candidate-group";const heading=document.createElement("h3");heading.textContent=`${node.props.label} (${rows.length})`;const table=document.createElement("table");table.className="candidate-table";const columns=node.props.columns||[];const head=document.createElement("tr");columns.forEach(column=>{const th=document.createElement("th");th.textContent=column.replaceAll("_"," ");head.append(th)});if(enabledHandoffs.length){const th=document.createElement("th");th.textContent="action";head.append(th)}const thead=document.createElement("thead");thead.append(head);const body=document.createElement("tbody");rows.forEach(item=>{const row=document.createElement("tr");columns.forEach(column=>{const cell=document.createElement("td");cell.textContent=item[column]??"—";if(column==="title")cell.title=item.title||"";row.append(cell)});if(enabledHandoffs.length){const cell=document.createElement("td");const wrap=document.createElement("div");wrap.className="candidate-action";if(actionHost.enabled){enabledHandoffs.forEach(h=>wrap.append(actionForm(h,`${repo}#${item.number}`)))}else{enabledHandoffs.forEach(h=>{const button=document.createElement("button");button.className="candidate-copy";button.textContent="Copy command";const command=`cortxt widget action ${h.id} --repo ${repo} --issue ${item.number} --approval-ref <ref> --confirm`;button.title=command;button.onclick=()=>copyCommand(command,button);const cmd=document.createElement("code");cmd.className="candidate-cmd";cmd.textContent=command;wrap.append(button,cmd)})}cell.append(wrap);row.append(cell)}body.append(row)});table.append(thead,body);group.append(heading,table);root.append(group)})}
let manifest=[];
function setBadge(id,text,cls){const b=$("badge-"+id);if(!b)return;b.textContent=text;b.className="badge "+(cls||"")}
async function renderWidget(w){const root=$("root-"+w.id);if(!root)return;try{const response=await fetch(w.artifact,{cache:"no-store"});if(!response.ok)throw Error(response.status);const tree=await response.json();root.replaceChildren();const status=document.createElement("div");status.className="pulse-status";const err=tree.error||{};const meta=tree.widget?` · ${tree.widget.id} v${tree.widget.version}`:"";status.textContent=err.kind?`Read failed · ${err.message||"unavailable"}${meta}`:`${w.title||w.id}${meta}`;if(err.kind)status.classList.add("error");root.append(status);if(err.kind){setBadge(w.id,"err","err");return}if(tree.handoffs?.length){renderActionable(tree,root)}else if(tree.render){renderGenericNode(tree.render,root)}else{root.append(emptyLine("No render tree."))}setBadge(w.id,tree.render?.state||"ok",tree.render?.state==="error"?"err":"ok")}catch(e){root.replaceChildren();empty(root,`Run \`${w.hint||"the widget command"}\` to create ${w.artifact}.`);setBadge(w.id,"off","off")}}
function buildShell(){const tabs=$("tabs"),content=$("content");tabs.replaceChildren();content.replaceChildren();manifest.forEach((w,i)=>{const btn=document.createElement("button");btn.textContent=w.title||w.id;btn.className=i===0?"active":"";btn.onclick=()=>selectTab(i);tabs.append(btn);const sec=document.createElement("section");sec.id="widget-"+w.id;sec.className="tab"+(i===0?"":" hidden");const head=document.createElement("div");head.className="head";const l=document.createElement("div");const eye=document.createElement("div");eye.className="eyebrow";eye.textContent="widget · "+w.artifact;const t=document.createElement("div");t.className="title";t.textContent=w.title||w.id;l.append(eye,t);const b=document.createElement("span");b.className="badge";b.id="badge-"+w.id;b.textContent="…";head.append(l,b);const root=document.createElement("div");root.className="candidates";root.id="root-"+w.id;sec.append(head,root);content.append(sec)})}
function selectTab(i){document.querySelectorAll(".tabs button").forEach((b,j)=>b.classList.toggle("active",j===i));manifest.forEach((w,j)=>{const sec=$("widget-"+w.id);if(sec)sec.classList.toggle("hidden",j!==i)})}
async function loadManifest(){try{const r=await fetch("widgets.json",{cache:"no-store"});if(!r.ok)throw Error(r.status);const m=await r.json();manifest=(m.widgets||[]).filter(w=>w.id&&w.artifact);if(!manifest.length)throw Error("empty manifest");buildShell();pollAll()}catch(e){empty($("content"),"No widgets manifest. Run `cortxt widget` to serve widgets (widgets.json).")}}
function pollAll(){manifest.forEach(renderWidget)}
probeActions();loadManifest();
setInterval(()=>{probeActions();if(manifest.length)pollAll()},3000);
</script></body></html>
