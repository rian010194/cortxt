[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortxt-agent-reasoning"
version = "0.0.1"
description = "Cortxt reasoning kernel — DM1 vertical slice (Kernel + operators)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4"]

[project.scripts]
cortxt = "cli.unified_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reasoning*", "portability*", "runtime*", "routing*", "security*", "cli*", "widget*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
markers = [
    "real_inference: opt-in test that makes real (L0) model calls; excluded by default",
    "docker_required: opt-in test that needs a running Docker daemon; excluded by default. These are Fas 3's container-boundary proof — a skip is NOT a pass.",
]
