[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortxt-agent-platform"
version = "0.0.1"
description = "Cortxt — provider-neutral platform for long-running AI work (agent-platform package)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
cortxt = "cortxt_entrypoint:main"

[tool.setuptools]
py-modules = ["cortxt_entrypoint"]

[tool.setuptools.packages.find]
where = ["."]
include = ["reasoning*", "portability*", "runtime*", "routing*", "security*", "cli*", "widget*", "learning*", "supervisor*", "context_store*", "harness*", "daemon*", "mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
markers = [
    "real_inference: opt-in test that makes real (L0) model calls; excluded by default",
    "docker_required: opt-in test that needs a running Docker daemon; excluded by default. These are Fas 3's container-boundary proof — a skip is NOT a pass.",
]
