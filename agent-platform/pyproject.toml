[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortxt-agent-reasoning"
version = "0.0.1"
description = "Cortxt reasoning kernel — DM1 vertical slice (Kernel + operators)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["reasoning*", "portability*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
markers = [
    "real_inference: opt-in test that makes real (L0) model calls; excluded by default",
]
