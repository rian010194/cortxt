name: "receptionist-notion"
version: "0.1.0"
maturity: "experimental"
category: "software-development"
description: "Receptionist for Notion workspace - CRUD, search, webhook for databases, pages, blocks, comments, users"
author: "Cortxt"
license: "MIT"
depends_on:
  - name: "receptionist-base"
    version: ">=0.1.0"
    required: true
  - name: "credential-manager"
    version: ">=0.1.0"
    required: true
interface:
  input_schema: "receptionist-notion.input.schema.json"
  output_schema: "receptionist-notion.output.schema.json"
  error_codes: "receptionist-notion.errors.schema.json"
  openapi: "receptionist-notion.openapi.yaml"
error_taxonomy:
  transient:
    - "RATE_LIMITED"
    - "UPSTREAM_ERROR"
    - "TIMEOUT"
    - "AUTH_EXPIRED"
  permanent:
    - "VALIDATION_ERROR"
    - "PERMISSION_DENIED"
    - "NOT_FOUND"
    - "VAULT_NOT_FOUND"
    - "NOTION_UNAUTHORIZED"
    - "NOTION_FORBIDDEN"
    - "NOTION_RATE_LIMITED"
    - "NOTION_VALIDATION_ERROR"
    - "NOTION_CONFLICT"
  retry_policy:
    transient:
      max_attempts: 3
      base_delay_ms: 500
      max_delay_ms: 10000
      backoff: "exponential"
    permanent:
      max_attempts: 0
compatibility:
  breaking_changes: []
  deprecated_in: null
  removed_in: null
observability:
  metrics:
    - "request.total"
    - "request.duration_ms"
    - "request.success"
    - "request.error"
    - "rate_limit.remaining"
    - "cache.hit"
    - "cache.miss"
    - "notion.api_calls"
    - "notion.pages_created"
    - "notion.databases_queried"
  traces: true
  logs: "structured-json"
interface_files:
  typescript: "interfaces/receptionist-notion.ts"
  openapi: "openapi/receptionist-notion.yaml"
  json_schemas:
    - "schemas/receptionist-notion.input.schema.json"
    - "schemas/receptionist-notion.output.schema.json"
    - "schemas/receptionist-notion.errors.schema.json"
  python_stubs: "stubs/receptionist-notion.pyi"