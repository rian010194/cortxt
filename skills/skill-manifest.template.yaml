# Skill Manifest Template

name: "<skill-name>"
version: "0.1.0"                    # Semver
maturity: "experimental"            # experimental | stable | deprecated
category: "<category>"
description: "<one-line description>"
author: "Cortxt"
license: "MIT"

# Dependencies
depends_on:
  - name: "<dependency-skill>"
    version: ">=0.1.0"
    required: true

# Interface Contract
interface:
  input_schema: "<skill-name>.input.schema.json"
  output_schema: "<skill-name>.output.schema.json"
  error_codes: "<skill-name>.errors.schema.json"
  openapi: "<skill-name>.openapi.yaml"

# Error Taxonomy & Retry Policy
error_taxonomy:
  transient: ["RATE_LIMITED", "UPSTREAM_ERROR", "TIMEOUT", "AUTH_EXPIRED"]
  permanent: ["VALIDATION_ERROR", "PERMISSION_DENIED", "NOT_FOUND"]
  retry_policy:
    transient:
      max_attempts: 3
      base_delay_ms: 500
      max_delay_ms: 10000
      backoff: "exponential"
    permanent:
      max_attempts: 0

# Compatibility
compatibility:
  breaking_changes: []              # List of versions with breaking changes
  deprecated_in: null               # Version where deprecated
  removed_in: null                  # Version where removed

# Observability
observability:
  metrics: ["request.total", "request.duration_ms", "request.success", "request.error", "rate_limit.remaining", "cache.hit", "cache.miss"]
  traces: true
  logs: "structured-json"