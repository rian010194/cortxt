openapi: 3.1.0
info:
  title: receptionist-base API
  version: 0.1.0
  description: "Generic base skill for system receptionists \u2014 provides auth,\
    \ CRUD, search, webhook, rate-limit, cache, and error handling foundations"
servers:
- url: local://
  description: Local skill invocation
paths:
  /call:
    post:
      summary: Invoke receptionist-base skill
      operationId: callSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/receptionistbaseRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/receptionistbaseResponse'
components:
  schemas:
    receptionistbaseRequest:
      type: object
      required:
      - action
      - resource
      - params
      - context
      properties:
        action:
          type: string
        resource:
          type: string
        params:
          type: object
        context:
          type: object
          required:
          - run_id
          - agent_id
          - trace_id
          - priority
          properties:
            run_id:
              type: string
            agent_id:
              type: string
            trace_id:
              type: string
            priority:
              type: string
              enum:
              - normal
              - high
              - low
            timeout_ms:
              type: integer
    receptionistbaseResponse:
      type: object
      required:
      - success
      - data
      - metadata
      properties:
        success:
          type: boolean
        data:
          type: object
          nullable: true
        metadata:
          type: object
          required:
          - request_id
          - timestamp
          - duration_ms
          - rate_limit_remaining
          - rate_limit_reset
          - cache_hit
          properties:
            request_id:
              type: string
            timestamp:
              type: string
              format: date-time
            duration_ms:
              type: integer
            rate_limit_remaining:
              type: integer
            rate_limit_reset:
              type: string
              format: date-time
            cache_hit:
              type: boolean
            pagination:
              type: object
              properties:
                page:
                  type: integer
                page_size:
                  type: integer
                total_pages:
                  type: integer
                total_items:
                  type: integer
        links:
          type: object
          additionalProperties:
            type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/receptionistbaseError'
    receptionistbaseError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
        recovery_hint:
          type: string
          enum:
          - refresh_token
          - backoff_retry
          - check_permissions
          - contact_admin
