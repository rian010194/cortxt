name: Atlas sync

# Regenerates the auto-generated sections of every atlas:map issue (#210),
# and publishes the derived Atlas status page + visual graph to the docs
# site (#285, #300) via a bot branch + pull request. Coordinator-owned
# sections (Destination, Decisions so far, Open questions) are never touched
# by this workflow -- see docs/agents/atlas.md.
#
# PR governance: map-issue writes stay on the default
# GITHUB_TOKEN (issues: write below). Publishing the site page/graph instead
# pushes a stable bot branch and opens/reuses one pull request, using a
# short-lived GitHub App installation token minted from the
# ATLAS_BOT_APP_ID / ATLAS_BOT_APP_PRIVATE_KEY secrets -- see
# "GitHub App requirements" in docs/agents/atlas.md. This is deliberate: a
# pull request authored/pushed with the default GITHUB_TOKEN does not
# trigger other workflows' `pull_request` events (GitHub's anti-recursion
# rule), so the PR's own CI would silently never run. If the App token is
# unavailable, the job fails loudly instead of falling back to
# GITHUB_TOKEN. This workflow never merges, approves, or closes its own
# pull request -- operator review and merge is required.

permissions:
  contents: read
  issues: write

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 6 * * *" # daily, off the hour to avoid GitHub Actions load spikes
  # Event-triggered refresh (issue #311, C.2; issue #329): refresh the maps +
  # site page + graph when issues, comments, or merged PRs change, instead of
  # only the daily schedule. The actor guard below prevents the atlas bot's and
  # github-actions bot's own writes from re-triggering the workflow (anti-loop).
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, transferred]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [closed]

concurrency:
  group: atlas-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Anti-loop: the atlas bot's and github-actions bot's own sync writes must not
    # re-trigger an event run; the daily schedule and manual dispatch are
    # unaffected (they run without this filter). PR events only run if merged.
    if: ${{ (github.event_name != 'issues' && github.event_name != 'issue_comment' && github.event_name != 'pull_request' || (github.actor != 'cortxt-atlas[bot]' && github.actor != 'github-actions[bot]')) && (github.event_name != 'pull_request' || github.event.pull_request.merged == true) }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run Atlas sync (maps + site page emit + visual graph emit)
        id: sync
        run: |
          python scripts/atlas_sync.py --repo "$GITHUB_REPOSITORY" \
            --emit-site "$GITHUB_WORKSPACE" \
            --emit-graph "$GITHUB_WORKSPACE"
        continue-on-error: true

      - name: Report failure without discarding last-good map content
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::Atlas sync failed -- last-good map content is preserved (no write happened for the failing map(s)). See the job log above for details."
          exit 1

      - name: Check for publishable site page/graph changes
        id: diff
        if: steps.sync.outcome == 'success'
        run: |
          set -euo pipefail
          if git diff --quiet -- site/src/content/docs/docs/atlas-status.md site/public/atlas/graph.json; then
            echo "Atlas site page and graph unchanged; nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint Atlas bot GitHub App installation token
        id: app-token
        if: steps.diff.outputs.changed == 'true'
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.ATLAS_BOT_APP_ID }}
          private-key: ${{ secrets.ATLAS_BOT_APP_PRIVATE_KEY }}

      - name: Require a bot app token before publishing
        if: steps.diff.outputs.changed == 'true' && steps.app-token.outcome != 'success'
        run: |
          echo "::error::Atlas publish refused: no usable GitHub App installation token. Set the ATLAS_BOT_APP_ID and ATLAS_BOT_APP_PRIVATE_KEY repository secrets for a minimally-scoped GitHub App (permissions: Contents read/write, Pull requests read/write -- see 'GitHub App requirements' in docs/agents/atlas.md). The default GITHUB_TOKEN is deliberately not used as a fallback here: a branch pushed or PR opened with it does not trigger other workflows' pull_request CI, so the publish PR's own checks would silently never run."
          exit 1

      - name: Push bot branch and open/reuse the Atlas publish PR
        if: steps.diff.outputs.changed == 'true'
        env:
          ATLAS_BOT_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_BRANCH: atlas-sync/bot-updates
          ALLOWED_PATHS: site/src/content/docs/docs/atlas-status.md site/public/atlas/graph.json
        run: |
          set -euo pipefail

          # Unexpected-path allowlist: only the two derived publish artifacts
          # may ever be part of this commit. Anything else changed in the
          # working tree (e.g. a stray write from a future script change)
          # aborts the publish instead of being committed silently.
          UNEXPECTED="$(git status --porcelain -- . ':!site/src/content/docs/docs/atlas-status.md' ':!site/public/atlas/graph.json')"
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected changed paths outside the Atlas publish allowlist ($ALLOWED_PATHS) -- refusing to commit:"
            echo "$UNEXPECTED"
            exit 1
          fi

          git config user.name "cortxt-atlas[bot]"
          git config user.email "cortxt-atlas[bot]@users.noreply.github.com"
          git add site/src/content/docs/docs/atlas-status.md site/public/atlas/graph.json
          git commit -s -m "docs(atlas): publish derived Atlas status page and visual graph (issues #285, #300)"

          # Push only to the stable bot branch, never to main, and only ever
          # force-with-lease that one branch (never a plain --force).
          git remote set-url origin "https://x-access-token:${ATLAS_BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "$BOT_BRANCH" 2>/dev/null || true
          git push --force-with-lease origin "HEAD:refs/heads/${BOT_BRANCH}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

          EXISTING_PR="$(GH_TOKEN="$ATLAS_BOT_TOKEN" gh pr list --repo "$GITHUB_REPOSITORY" --head "$BOT_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$EXISTING_PR" ]; then
            GH_TOKEN="$ATLAS_BOT_TOKEN" gh pr create --repo "$GITHUB_REPOSITORY" --head "$BOT_BRANCH" --base main \
              --title "docs(atlas): publish derived Atlas status page and visual graph (issues #285, #300)" \
              --body "Automated refresh of the derived Atlas status page and visual graph from \`scripts/atlas_sync.py\`. This workflow never merges, approves, or closes its own pull request -- operator review and merge is required."
            echo "Opened a new Atlas publish PR."
          else
            echo "Reused existing Atlas publish PR #$EXISTING_PR (branch updated in place)."
          fi

      - name: Job summary
        if: always()
        run: |
          echo "## Atlas sync" >> "$GITHUB_STEP_SUMMARY"
          echo "See individual atlas:map issue comments for the per-map sync summary." >> "$GITHUB_STEP_SUMMARY"
