name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  site-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  agent-platform-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml jsonschema cryptography
      - run: pip install git+https://github.com/rian010194/cortxt-resilient-inference.git
      - run: pytest agent-platform/ -m "not real_inference and not docker_required"

  agent-platform-docker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml jsonschema cryptography
      - run: pip install git+https://github.com/rian010194/cortxt-resilient-inference.git
      - run: docker info
      - run: pytest agent-platform/ -m docker_required -v

  # Issue #378: automated contrast/schema/rendering gate for the
  # visual-tokens.v2 preset collection (issue #373). Split into its own job
  # rather than folded into agent-platform-tests because that job is
  # currently red on main due to an unrelated, pre-existing
  # ModuleNotFoundError: cortxt_resilient_inference collection error
  # (tracked separately in issue #381) -- keeping this gate in its own job
  # means a real contrast/schema/rendering regression is never masked by,
  # or blamed on, that unrelated failure.
  theme-preset-accessibility-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest -e agent-platform/
      - run: >
          pytest
          agent-platform/tests/widget_contract/test_theme_preset_accessibility_gate.py
          agent-platform/tests/widget_contract/test_tokens.py
          -v
      - run: python scripts/test_widget_tokens.py
      - name: Check global design-system conformance
        run: python scripts/design_system_conformance.py

  # W1: the dispatch-path regression suites. These four files cover the
  # claim -> Evidence Gate -> review-submission chain in scripts/dispatcher.py,
  # scripts/worker_adapters.py and scripts/work_launcher.py, and until now no
  # CI command executed any of them: every pytest invocation above names
  # `agent-platform/`, which never descends into `scripts/`. Two of the four
  # also define no `test_*` callable, so simply adding `scripts/` to a pytest
  # path would have kept them dark while reporting green.
  #
  # They run as four separate `python` processes on purpose, matching the
  # existing `python scripts/test_*.py` steps in this file. Sharing one
  # interpreter is not safe here: test_worker_adapters.py replaces
  # sys.modules["dispatcher"] at import time, several files mutate the
  # process-wide ADAPTER_REGISTRY without restoring it, and two assert on a
  # clean CORTXT_BOUNDED_WORKER. Separate processes make each suite's result
  # its own, and a failure name the file that broke.
  #
  # No `pip install`: dispatcher/worker_adapters/work_launcher and their
  # transitive imports (commit_evidence, execution_map, launcher_inventory)
  # are pure standard library. The suites use fake GitHub, fake providers,
  # injected subprocess runners and temporary state only -- no `gh`, no real
  # runtime, no provider call, no write to the repository.
  #
  # PYTHONPATH, however, is required. `worker_adapters.HermesFreeAdapter.invoke`
  # imports `routing.worker_outcome` on its succeeded path (#520), and that
  # package lives under `agent-platform/`, which is not on `sys.path` when
  # `python scripts/test_*.py` puts `scripts/` there. A developer machine hides
  # this: `agent-platform` is installed editable there, so the import resolves
  # from site-packages and the suite passes locally while failing here. The
  # module itself is stdlib-only, so this adds a path entry, not a dependency.
  dispatch-path-tests:
    runs-on: ubuntu-latest
    # `scripts/` is sys.path[0] for each `python scripts/test_*.py`, so it still
    # wins on any name it shares with agent-platform; this only adds a fallback.
    env:
      PYTHONPATH: agent-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dispatcher claim/complete contract (#122, #493)
        run: python scripts/test_dispatcher.py
      - name: Worker adapter envelopes and dispatch_async (#419, #482)
        run: python scripts/test_worker_adapters.py
      - name: Work launcher execution gate (#419, #482)
        run: python scripts/test_work_launcher.py
      - name: Launcher/execution-map integration (#262)
        run: python scripts/test_launcher_integration.py
      # W8. Same reasoning as the four above: this suite lives in `scripts/`,
      # so no pytest invocation in this file reaches it. It is stdlib-only and
      # injects `action_host.main`, so it binds no host and imports nothing
      # from agent-platform.
      - name: Cortxt OS start path refusals (W8)
        run: python scripts/test_start_cortxt_os.py

  dco-signoff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # DCO: every AUTHORED commit in the PR range must carry a
          # Signed-off-by trailer. GitHub-generated merge commits (multi-
          # parent) are exempt: GitHub creates them and they can never carry
          # a meaningful operator trailer. Enforcement for future authored
          # commits is unchanged. Grandfathered baseline: none of the
          # authored commits in the S5/S5.5/S6 integration history are
          # exempted — all carry Signed-off-by already (verified 2026-08-29).
          failed=0
          while IFS= read -r commit; do
            parents="$(git show -s --format=%P "${commit}")"
            if [ "$(echo "${parents}" | tr ' ' '\n' | grep -c .)" -gt 1 ]; then
              continue  # GitHub-generated merge commit
            fi
            if ! git show -s --format=%B "${commit}" |
              git interpret-trailers --parse |
              grep -iqE '^Signed-off-by:[[:space:]]+.+$'; then
              echo "::error::Commit ${commit} is missing a Signed-off-by trailer."
              failed=1
            fi
          done < <(git rev-list --reverse "${base}..${head}")
          exit "${failed}"

  adr-doc-currency:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -euo pipefail
          base="origin/${GITHUB_BASE_REF}"
          changed="$(git diff --name-only "${base}...HEAD")"
          echo "Files changed vs ${base}:"
          echo "${changed}"
          adr_files="$(echo "${changed}" | grep -E '^docs/adr/[0-9]+-.*\.md$' || true)"
          if [ -z "${adr_files}" ]; then
            echo "OK: no numbered ADR files changed; documentation-currency gate not triggered."
            exit 0
          fi
          echo "Changed numbered ADR files:"
          echo "${adr_files}"
          accepted=""
          while IFS= read -r f; do
            if [ -f "${f}" ] && grep -iqE '^(\*\*)?Status:(\*\*)?[[:space:]]*Accepted\b' "${f}"; then
              accepted="${accepted}${f}"$'\n'
            fi
          done <<< "${adr_files}"
          if [ -z "${accepted}" ]; then
            echo "OK: changed ADR file(s) are not Accepted (draft/proposed/superseded); gate not triggered."
            exit 0
          fi
          if echo "${changed}" | grep -qx 'docs/architecture/REVIEW_LOG.md'; then
            echo "OK: Accepted ADR(s) changed and docs/architecture/REVIEW_LOG.md is updated in the same PR:"
            echo "${accepted}"
            exit 0
          fi
          adrs_oneline="$(echo "${accepted}" | paste -sd' ' -)"
          echo "::error::Accepted ADR(s) changed without updating docs/architecture/REVIEW_LOG.md: ${adrs_oneline} -- per AGENTS.md section \"Documentation currency\", an Accepted ADR must add a row to docs/architecture/REVIEW_LOG.md (append-only register) in the same PR."
          exit 1

  docs-site-currency:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests for docs-currency
        run: python scripts/test_docs_currency.py
      - name: Verify derived site pages match repository authority
        run: |
          set -euo pipefail
          python scripts/docs_currency.py --check
      - name: Semantic currency checks for public documentation
        run: python scripts/docs_semantic_currency.py

  label-invariant:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/test_label_invariant.py
      - name: Check ADR-040 label invariant
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/label_invariant.py --repo "${{ github.repository }}" --limit 50
