name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  site-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  agent-platform-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml jsonschema cryptography
      - run: pip install git+https://github.com/rian010194/cortxt-resilient-inference.git
      - run: pytest agent-platform/ -m "not real_inference and not docker_required"

  agent-platform-docker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml jsonschema cryptography
      - run: pip install git+https://github.com/rian010194/cortxt-resilient-inference.git
      - run: docker info
      - run: pytest agent-platform/ -m docker_required -v

  # Issue #378: automated contrast/schema/rendering gate for the
  # visual-tokens.v2 preset collection (issue #373). Split into its own job
  # rather than folded into agent-platform-tests because that job is
  # currently red on main due to an unrelated, pre-existing
  # ModuleNotFoundError: cortxt_resilient_inference collection error
  # (tracked separately in issue #381) -- keeping this gate in its own job
  # means a real contrast/schema/rendering regression is never masked by,
  # or blamed on, that unrelated failure.
  theme-preset-accessibility-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest -e agent-platform/
      - run: >
          pytest
          agent-platform/tests/widget_contract/test_theme_preset_accessibility_gate.py
          agent-platform/tests/widget_contract/test_tokens.py
          -v
      - run: python scripts/test_widget_tokens.py

  dco-signoff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          failed=0
          while IFS= read -r commit; do
            if ! git show -s --format=%B "${commit}" |
              git interpret-trailers --parse |
              grep -iqE '^Signed-off-by:[[:space:]]+.+$'; then
              echo "::error::Commit ${commit} is missing a Signed-off-by trailer."
              failed=1
            fi
          done < <(git rev-list --reverse "${base}..${head}")
          exit "${failed}"

  adr-doc-currency:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -euo pipefail
          base="origin/${GITHUB_BASE_REF}"
          changed="$(git diff --name-only "${base}...HEAD")"
          echo "Files changed vs ${base}:"
          echo "${changed}"
          adr_files="$(echo "${changed}" | grep -E '^docs/adr/[0-9]+-.*\.md$' || true)"
          if [ -z "${adr_files}" ]; then
            echo "OK: no numbered ADR files changed; documentation-currency gate not triggered."
            exit 0
          fi
          echo "Changed numbered ADR files:"
          echo "${adr_files}"
          accepted=""
          while IFS= read -r f; do
            if [ -f "${f}" ] && grep -iqE '^(\*\*)?Status:(\*\*)?[[:space:]]*Accepted\b' "${f}"; then
              accepted="${accepted}${f}"$'\n'
            fi
          done <<< "${adr_files}"
          if [ -z "${accepted}" ]; then
            echo "OK: changed ADR file(s) are not Accepted (draft/proposed/superseded); gate not triggered."
            exit 0
          fi
          if echo "${changed}" | grep -qx 'docs/architecture/REVIEW_LOG.md'; then
            echo "OK: Accepted ADR(s) changed and docs/architecture/REVIEW_LOG.md is updated in the same PR:"
            echo "${accepted}"
            exit 0
          fi
          adrs_oneline="$(echo "${accepted}" | paste -sd' ' -)"
          echo "::error::Accepted ADR(s) changed without updating docs/architecture/REVIEW_LOG.md: ${adrs_oneline} -- per AGENTS.md section \"Documentation currency\", an Accepted ADR must add a row to docs/architecture/REVIEW_LOG.md (append-only register) in the same PR."
          exit 1

  docs-site-currency:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests for docs-currency
        run: python scripts/test_docs_currency.py
      - name: Verify derived site pages match repository authority
        run: |
          set -euo pipefail
          python scripts/docs_currency.py --check

  label-invariant:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/test_label_invariant.py
      - name: Check ADR-040 label invariant
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/label_invariant.py --repo "${{ github.repository }}" --limit 50
