name: vertical_01_research_complete
description: Return primary-source research to Coordinator.
enabled: false
trigger:
  on: message_posted
  filter: 'str_starts_with(trigger_text, "[RESEARCH_COMPLETE]")'
steps:
  - id: return_research
    name: Return verified research
    timeout_secs: 30
    action: send_message
    text: |
      @Coordinator Researcher returned verification evidence. Assess its
      impact and prepare a complete dispatch request. Keep Needs primary-source
      research on every legal constraint that remains unverified.

      Research result:
      Trigger message ID: {{trigger.message_id}}
      {{trigger.text}}
